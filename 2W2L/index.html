<!-- 
版本號：v1.8
修改主旨：優化效能，利用 Swiper 的 slideChangeTransitionEnd 事件，只讓當前畫面的 Lottie 動畫播放，非當前畫面停止播放，並移除 HTML 中預設的 autoplay。
-->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人生二路</title>

    <!-- Open Graph Meta -->
    <meta property="og:title" content="人生二路">
    <meta property="og:description" content="一本解釋聖經福音的互動小冊子，探討人生兩條路的抉擇。">
    <meta property="og:type" content="website">

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="人生二路">
    <link rel="apple-touch-icon" href="./icon-180.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Lottie Web Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        :root {
            --app-height: 100vh;
        }

        html, body {
            height: var(--app-height);
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling outside swiper */
            background-color: #0f172a;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        /* Swiper adjustments */
        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        /* Lottie Container */
        .lottie-container {
            width: 80vw;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Custom Pagination */
        .swiper-pagination-bullet {
            background: #64748b;
            opacity: 0.5;
        }
        .swiper-pagination-bullet-active {
            background: #ffffff;
            opacity: 1;
        }

        /* iOS Install Modal */
        #ios-install-modal {
            display: none;
        }
        #ios-install-modal.show {
            display: flex;
        }

        /* 安裝按鈕樣式 (預設隱藏) */
        #install-button {
            display: none;
        }
        #install-button.show {
            display: flex;
        }
    </style>
</head>
<body class="text-slate-200 select-none bg-slate-900">

    <!-- 安裝按鈕 (固定在右上角) -->
    <button id="install-button" class="fixed top-4 right-4 z-40 bg-slate-800/80 backdrop-blur-sm border border-slate-700 text-slate-200 px-4 py-2 rounded-full text-sm font-medium shadow-lg items-center space-x-2 hover:bg-slate-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-400 inline-block" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
        <span class="inline-block ml-1">安裝 App</span>
    </button>

    <div id="app-content" class="w-full h-full relative">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                
                <!-- Slide 1 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">1</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">神，良善的統治者及創造主</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge1.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

                <!-- Slide 2 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">2</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">我們反叛了神，我們是邪惡的</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge2.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

                <!-- Slide 3 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">3</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">神是公義的，必刑罰所有惡人</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge3.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

                <!-- Slide 4 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">4</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">神派耶穌替我們這些惡人受罰</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge4.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

                <!-- Slide 5 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">5</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">耶穌，復活的統治者及拯救者</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge5.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

                <!-- Slide 6 -->
                <div class="swiper-slide">
                    <div class="text-center mb-8">
                        <span class="text-slate-400 font-bold text-lg tracking-widest uppercase">6</span>
                        <h2 class="text-3xl font-extrabold text-white mt-2 leading-tight">人生兩條路，你怎麼選？</h2>
                    </div>
                    <div class="lottie-container">
                        <lottie-player src="./Badge6.json" background="transparent" speed="1" style="width: 100%; height: 100%;" loop></lottie-player>
                    </div>
                </div>

            </div>
            <!-- Pagination Indicator -->
            <div class="swiper-pagination mb-4"></div>
        </div>
    </div>

    <div id="ios-install-modal" class="fixed inset-0 z-50 bg-black/80 items-end justify-center pb-8 px-4 transition-opacity">
        <div class="bg-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl transform transition-transform translate-y-0 relative border border-slate-700">
            <button id="close-ios-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="text-center">
                <div class="bg-slate-700 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-inner">
                    <img src="./icon-180.png" alt="App Icon" class="w-12 h-12 rounded-xl" onerror="this.src='https://placehold.co/180x180/0f172a/ffffff?text=2W'">
                </div>
                <h3 class="text-xl font-bold text-white mb-2">安裝到主畫面</h3>
                <p class="text-sm text-slate-300 mb-6">將「人生二路」加入主畫面，以獲得全螢幕的最佳體驗。</p>
                <div class="flex flex-col items-center justify-center space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex items-center text-sm text-slate-300">
                        1. 點擊下方工具列的 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-1 text-blue-400 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg> 分享按鈕
                    </div>
                    <div class="flex items-center text-sm text-slate-300">
                        2. 選擇「加入主畫面」 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-1 text-slate-200 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        
        // Fix for mobile 100vh issue (especially iOS Safari)
        const appHeight = () => {
            const doc = document.documentElement
            doc.style.setProperty('--app-height', `${window.innerHeight}px`)
        }
        window.addEventListener('resize', appHeight)
        appHeight()

        // Initialize Swiper
        const swiper = new Swiper(".mySwiper", {
            direction: "horizontal", // Swipe left/right
            loop: false,             // Do not loop
            resistanceRatio: 0.85,   // Bouncy resistance at edges
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            on: {
                // 初始化完成時，播放第一個動畫
                init: function () {
                    playCurrentLottie(this);
                },
                // 滑動過渡結束時，播放當前動畫，停止其他動畫
                slideChangeTransitionEnd: function () {
                    playCurrentLottie(this);
                }
            }
        });

        // 獨立出的 Lottie 控制函數
        function playCurrentLottie(swiperInstance) {
            // 取得所有的 slides
            const slides = swiperInstance.slides;
            // 當前的 index
            const activeIndex = swiperInstance.activeIndex;

            slides.forEach((slide, index) => {
                // 找出該 slide 內的 lottie-player
                const lottiePlayer = slide.querySelector('lottie-player');
                
                if (lottiePlayer) {
                    if (index === activeIndex) {
                        // 如果是當前畫面，執行播放
                        lottiePlayer.play();
                    } else {
                        // 如果不是當前畫面，執行停止（歸零並暫停）
                        lottiePlayer.stop();
                    }
                }
            });
        }

        // Register Service Worker (Required for Android PWA prompt)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 改為註冊同目錄下的實體 sw.js 檔案
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // --- PWA 安裝邏輯 (整合 Android 與 iOS) ---
        
        // 判斷是否為 iOS 設備
        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test( userAgent );
        }
        
        // 判斷是否已經在 PWA 模式 (已安裝) 下運行
        const isInStandaloneMode = () => {
            return ('standalone' in window.navigator) && (window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
        }

        let deferredPrompt;
        const installButton = document.getElementById('install-button');
        const iosModal = document.getElementById('ios-install-modal');

        // 1. Android 專屬：攔截原生安裝提示
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // 顯示安裝按鈕 (防呆：確保非 iOS 才由這裡觸發)
            if(installButton && !isIos()) {
                installButton.classList.add('show');
            }
        });

        // 2. iOS 專屬：若為 iOS 且尚未安裝，直接將安裝按鈕顯示出來
        if (isIos() && !isInStandaloneMode()) {
            if(installButton) {
                installButton.classList.add('show');
            }
        }

        // 3. 綁定按鈕點擊事件 (根據設備執行不同行為)
        if(installButton) {
            installButton.addEventListener('click', async () => {
                if (isIos()) {
                    // iOS 行為：顯示手動安裝教學 Modal
                    if(iosModal) iosModal.classList.add('show');
                } else if (deferredPrompt) {
                    // Android 行為：呼叫原生安裝視窗
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    deferredPrompt = null;
                    installButton.classList.remove('show');
                }
            });
        }

        // 4. 監聽是否安裝成功，成功後將按鈕隱藏
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            if(installButton) {
                installButton.classList.remove('show');
            }
        });

        // iOS Modal 關閉邏輯
        const closeBtn = document.getElementById('close-ios-modal');
        if(closeBtn) {
            closeBtn.addEventListener('click', () => {
                if(iosModal) iosModal.classList.remove('show');
            });
        }
    </script>
</body>
</html>
