    <style>
        :root {
            --app-height: 100vh;
        }

        html, body {
            height: var(--app-height);
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling outside swiper */
            background-color: #0f172a;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            /* Force portrait feel by preventing landscape rotation if possible, though mostly handled by media queries */
            overscroll-behavior-y: none;
        }

        /* Enforce Portrait orientation suggestion */
        @media screen and (orientation: landscape) {
            .landscape-warning {
                display: flex !important;
            }
            #app-content {
                display: none !important;
            }
        }

        /* Swiper adjustments */
        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        /* Lottie Container */
        .lottie-container {
            width: 80vw;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Custom Pagination */
        .swiper-pagination-bullet {
            background: #64748b;
            opacity: 0.5;
        }
        .swiper-pagination-bullet-active {
            background: #ffffff;
            opacity: 1;
        }

        /* 只有在 body 同時具有 is-mobile-device 和 is-landscape 時，才顯示警告並隱藏內容 */
        body.is-mobile-device.is-landscape .landscape-warning {
            display: flex !important;
        }
        body.is-mobile-device.is-landscape #app-content {
            display: none !important;
        }

        /* iOS Install Modal */
        #ios-install-modal {
            display: none;
        }
        #ios-install-modal.show {
            display: flex;
        }

        /* 安裝按鈕樣式 (預設隱藏) */
        #install-button {
            display: none;
        }
        #install-button.show {
            display: flex;
        }
    </style>
</head>
<body class="text-slate-200 select-none bg-slate-900">

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        
        // --- Device and Orientation Detection Logic ---
        
        // 1. Detect if the user is on a mobile device (includes tablets)
        // 增加觸控螢幕判斷，更準確識別行動裝置
        const isMobileDevice = () => {
            return (typeof window.orientation !== "undefined") || 
                   (navigator.userAgent.indexOf('IEMobile') !== -1) || 
                   (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) ||
                   (window.matchMedia("(any-pointer:coarse)").matches);
        };

        // 2. Monitor orientation changes to toggle the landscape warning class
        const checkOrientation = () => {
            // 只有行動裝置才需要進行方向檢查
            if (isMobileDevice()) {
                document.body.classList.add('is-mobile-device');
                // 使用 window.innerWidth/innerHeight 判斷，避免部分舊設備 orientation 不準確
                if (window.innerWidth > window.innerHeight) {
                    document.body.classList.add('is-landscape');
                } else {
                    document.body.classList.remove('is-landscape');
                }
            } else {
                // 如果不是行動裝置，確保移除這些 class，避免任何干擾
                document.body.classList.remove('is-mobile-device');
                document.body.classList.remove('is-landscape');
            }
        };

        // Check on initial load
        checkOrientation();

        // Check whenever the window resizes or orientation changes
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);


        // Fix for mobile 100vh issue (especially iOS Safari)
        const appHeight = () => {
            const doc = document.documentElement
            doc.style.setProperty('--app-height', `${window.innerHeight}px`)
        }
        window.addEventListener('resize', appHeight)
        appHeight()

        // Initialize Swiper
        const swiper = new Swiper(".mySwiper", {
            direction: "horizontal", // Swipe left/right
            loop: false,             // Do not loop
            resistanceRatio: 0.85,   // Bouncy resistance at edges
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });

        
        // Register Service Worker (Required for Android PWA prompt)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 改為註冊同目錄下的實體 sw.js 檔案
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Handle Android Install Prompt
        let deferredPrompt;
        const installButton = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            // 阻止 Chrome 預設的迷你安裝提示
            e.preventDefault();
            // 儲存事件，以便稍後觸發
            deferredPrompt = e;
            
            // 顯示畫面上的「安裝 App」按鈕
            if(installButton) {
                installButton.classList.add('show');
            }
        });

        // 綁定安裝按鈕的點擊事件
        if(installButton) {
            installButton.addEventListener('click', async () => {
                if (deferredPrompt) {
                    // 顯示系統原生的安裝視窗
                    deferredPrompt.prompt();
                    
                    // 等待使用者選擇（接受或拒絕）
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    
                    // 無論結果如何，都將 deferredPrompt 清空，並隱藏按鈕
                    deferredPrompt = null;
                    installButton.classList.remove('show');
                }
            });
        }

        // 監聽是否安裝成功，成功後隱藏按鈕
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            if(installButton) {
                installButton.classList.remove('show');
            }
        });

        // Detect iOS (Safari) to show manual install modal
        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test( userAgent );
        }
        
        // Detect if the app is already in standalone mode (installed)
        const isInStandaloneMode = () => {
            return ('standalone' in window.navigator) && (window.navigator.standalone);
        }

        // Show iOS Modal if needed
        if (isIos() && !isInStandaloneMode()) {
            // Show modal after a slight delay to ensure everything loaded
            setTimeout(() => {
                const iosModal = document.getElementById('ios-install-modal');
                if(iosModal) {
                    iosModal.classList.add('show');
                }
            }, 2000);
        }

        // Close iOS Modal logic
        const closeBtn = document.getElementById('close-ios-modal');
        if(closeBtn) {
            closeBtn.addEventListener('click', () => {
                document.getElementById('ios-install-modal').classList.remove('show');
            });
        }
    </script>
