<!-- 版本號: v1.3.8, 修改主旨: 微調第 5、6 個徽章「耶穌」中文文字高度（向上微調） -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徽章 A4 列印排版系統 (黑白/無動畫)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Lottie Web Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --preview-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 控制面板樣式 */
        header {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo-section h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-section p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
        }

        .btn-toggle {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle.active {
            background: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--text-primary);
            border: none;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
        }

        .slider-container input {
            width: 100px;
            cursor: pointer;
        }

        .slider-val {
            font-size: 0.85rem;
            font-family: monospace;
            min-width: 30px;
            text-align: right;
        }

        /* 預覽區域樣式 */
        .preview-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background-color: #0b0f19;
            overflow-y: auto;
        }

        /* 模擬 A4 紙張 */
        .a4-page {
            background: white;
            color: black;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            position: relative;
            transform-origin: top center;
        }

        /* A4 直式尺寸 */
        .a4-page.portrait {
            width: 210mm;
            height: 297mm;
        }

        /* A4 橫式尺寸 */
        .a4-page.landscape {
            width: 297mm;
            height: 210mm;
        }

        /* 3x2 網格排版 (包含外框虛線) */
        .grid-layout {
            display: grid;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 10mm; /* 稍微留點邊距，避免印表機邊緣切到 */
        }

        .a4-page.portrait .grid-layout {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .a4-page.landscape .grid-layout {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .grid-cell {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-right: 1px dashed #999999;
            border-bottom: 1px dashed #999999;
            box-sizing: border-box;
            padding: 12px;
            overflow: hidden;
        }

        /* 頂邊線：第一列的方格 (1, 2, 3) */
        .grid-cell:nth-child(-n+3) {
            border-top: 1px dashed #999999;
        }

        /* 左邊線：第一欄的方格 (1, 4) */
        .grid-cell:nth-child(3n+1) {
            border-left: 1px dashed #999999;
        }

        /* 徽章容器，填滿剩餘高度 */
        .lottie-container {
            position: relative; /* 用於定位覆蓋的文字 */
            flex: 1;
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            margin: auto;
            min-height: 0; /* 讓 flex 項目能收縮至小於內容高度 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lottie-container svg {
            width: auto !important;
            height: auto !important;
            max-width: 100% !important;
            max-height: 100% !important;
            display: block;
        }

        /* 徽章 6 中間的「還是」中文文字覆蓋樣式 */
        .or-text-overlay {
            position: absolute;
            top: 59.5%;
            left: 47.5%; /* 稍微左移以避免遮擋右側人像 */
            transform: translate(-50%, -50%);
            font-size: 11px; /* 稍微縮小 */
            font-weight: normal; /* 取消粗體 */
            color: #000000;
            background-color: #ffffff;
            padding: 1px 2px;
            z-index: 10;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
            border-radius: 2px;
        }

        /* 徽章 4 中的「耶穌」中文文字覆蓋樣式 */
        .jesus-text-overlay-4 {
            position: absolute;
            top: 43.5%;
            left: 61.5%; /* 向左微調，靠近中央十字架 */
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: normal;
            color: #000000;
            background-color: #ffffff;
            padding: 1px 2px;
            z-index: 10;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
            border-radius: 2px;
        }

        /* 徽章 5 中的「耶穌」中文文字覆蓋樣式 */
        .jesus-text-overlay-5 {
            position: absolute;
            top: 40.8%; /* 稍微向上微調高度 */
            left: 50%; /* 水平居中於皇冠內 */
            transform: translate(-50%, -50%);
            font-size: 10px; /* 縮小字體以契合皇冠內空間 */
            font-weight: normal;
            color: #000000;
            background-color: transparent; /* 改為透明底，防止遮擋皇冠線條 */
            padding: 0;
            z-index: 10;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 徽章 6 中的「耶穌」中文文字覆蓋樣式 */
        .jesus-text-overlay-6 {
            position: absolute;
            top: 41.5%; /* 稍微向上微調高度 */
            left: 57.2%; /* 向左微調，置中於大皇冠內 */
            transform: translate(-50%, -50%);
            font-size: 10px; /* 縮小字體 */
            font-weight: normal;
            color: #000000;
            background-color: transparent; /* 改為透明底，防止遮擋皇冠線條 */
            padding: 0;
            z-index: 10;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 標題與文字說明樣式 */
        .title-container {
            width: 100%;
            text-align: center;
            margin-top: 8px;
            flex-shrink: 0; /* 防止標題被縮小 */
        }

        .title-main {
            font-size: 1.1rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        .title-sub {
            font-size: 0.75rem;
            font-weight: 500;
            color: #333333;
            line-height: 1.4;
        }

        /* 列印專用 CSS */
        @media print {
            header {
                display: none !important;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .preview-container {
                padding: 0 !important;
                background: white !important;
                overflow: visible !important;
            }

            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                border: none !important;
                page-break-after: avoid;
                page-break-before: avoid;
            }

            .a4-page.portrait {
                width: 210mm !important;
                height: 297mm !important;
            }

            .a4-page.landscape {
                width: 297mm !important;
                height: 210mm !important;
            }

            /* 列印時保持虛線 (用於剪裁) */
            .grid-cell {
                border-right: 1px dashed #999999 !important;
                border-bottom: 1px dashed #999999 !important;
            }
            .grid-cell:nth-child(-n+3) {
                border-top: 1px dashed #999999 !important;
            }
            .grid-cell:nth-child(3n+1) {
                border-left: 1px dashed #999999 !important;
            }
        }
    </style>
</head>
<body>

    <header class="no-print">
        <div class="logo-section">
            <h1>徽章 A4 列印排版系統</h1>
            <p>向量級黑白高解析度列印</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <span class="control-label">A4 紙張方向</span>
                <div class="btn-group">
                    <button class="btn-toggle active" id="btn-landscape" onclick="setOrientation('landscape')">橫向 (大圖示)</button>
                    <button class="btn-toggle" id="btn-portrait" onclick="setOrientation('portrait')">縱向</button>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">版面樣式</span>
                <div class="btn-group">
                    <button class="btn-toggle active" id="btn-style-full" onclick="setStyleMode('full')">完整版</button>
                    <button class="btn-toggle" id="btn-style-clean" onclick="setStyleMode('clean')">俐落版</button>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">線條粗細微調</span>
                <div class="slider-container">
                    <input type="range" id="stroke-slider" min="50" max="250" value="100" oninput="updateStroke(this.value)">
                    <span class="slider-val" id="stroke-val">1.0x</span>
                </div>
            </div>

            <button class="btn-primary" onclick="window.print()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                列印此頁
            </button>
        </div>
    </header>

    <div class="preview-container">
        <!-- A4 紙張預覽區 -->
        <div class="a4-page landscape" id="a4-page">
            <div class="grid-layout">
                <!-- 方格 1 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-1"></div>
                    <div class="title-container" id="title-1"></div>
                </div>
                <!-- 方格 2 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-2"></div>
                    <div class="title-container" id="title-2"></div>
                </div>
                <!-- 方格 3 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-3"></div>
                    <div class="title-container" id="title-3"></div>
                </div>
                <!-- 方格 4 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-4">
                        <div class="jesus-text-overlay-4">耶穌</div>
                    </div>
                    <div class="title-container" id="title-4"></div>
                </div>
                <!-- 方格 5 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-5">
                        <div class="jesus-text-overlay-5">耶穌</div>
                    </div>
                    <div class="title-container" id="title-5"></div>
                </div>
                <!-- 方格 6 -->
                <div class="grid-cell">
                    <div class="lottie-container" id="badge-6">
                        <div class="or-text-overlay">還是</div>
                        <div class="jesus-text-overlay-6">耶穌</div>
                    </div>
                    <div class="title-container" id="title-6"></div>
                </div>
            </div>
        </div>
    </div>

        // 標題與說明文字資料
        const badgeTitles = [
            { num: "1", main: "神", sub1: "慈愛的掌權者", sub2: "創造萬物的主宰" },
            { num: "2", main: "人", sub1: "我們反叛了神", sub2: "我們是邪惡的" },
            { num: "3", main: "審判", sub1: "神是公義的", sub2: "必刑罰所有惡人" },
            { num: "4", main: "耶穌", sub1: "代替惡人受罰", sub2: "死在十字架上" },
            { num: "5", main: "耶穌", sub1: "復活的掌權者", sub2: "拯救所有信靠他的人" },
            { num: "6", main: "回應", sub1: "人生兩條路", sub2: "你怎麼選？" }
        ];

        // 初始化標題文字
        function initTitles() {
            for (let i = 1; i <= 6; i++) {
                const container = document.getElementById('title-' + i);
                const titleData = badgeTitles[i - 1];
                container.innerHTML = `
                    <div class="title-main">${titleData.num} ${titleData.main}</div>
                    <div class="title-sub">${titleData.sub1}<br>${titleData.sub2}</div>
                `;
            }
        }

        // 判斷顏色是否為白色
        function isColorWhite(c) {
            if (!c || !Array.isArray(c.k)) return false;
            let r, g, b;
            if (typeof c.k[0] === 'number') {
                [r, g, b] = c.k;
            } else if (c.k[0] && Array.isArray(c.k[0].s)) {
                [r, g, b] = c.k[0].s;
            } else {
                return false;
            }
            return r > 0.95 && g > 0.95 && b > 0.95;
        }

        // 深拷貝並修改 Lottie 資料，將所有線條 (Stroke) 修改為黑色，並保留白色填充 (Fill)
        // mode: 'full' | 'clean'
        function convertToBlackAndWhite(obj, mode, badgeIndex) {
            if (!obj || typeof obj !== 'object') return;

            // 如果是第 4 個徽章 (badgeIndex === 3) 且是 Layer "J" (原圖中的 "J" 字樣圖層)，將其完全隱藏
            if (badgeIndex === 3 && obj.nm === 'J') {
                if (obj.ks && obj.ks.o) {
                    obj.ks.o.k = 0;
                    if (Array.isArray(obj.ks.o.k)) {
                        obj.ks.o.k = 0;
                    }
                } else {
                    obj.ks = obj.ks || {};
                    obj.ks.o = { a: 0, k: 0 };
                }
            }

            // 如果是第 5 個徽章 (badgeIndex === 4) 且是 Layer "Layer 8" (原圖中的 "J" 字樣圖層)，將其完全隱藏
            if (badgeIndex === 4 && obj.nm === 'Layer 8') {
                if (obj.ks && obj.ks.o) {
                    obj.ks.o.k = 0;
                    if (Array.isArray(obj.ks.o.k)) {
                        obj.ks.o.k = 0;
                    }
                } else {
                    obj.ks = obj.ks || {};
                    obj.ks.o = { a: 0, k: 0 };
                }
            }

            // 如果是第 6 個徽章 (badgeIndex === 5) 且是 Layer "Layer 17" (原圖中的 "J" 字樣圖層)，將其完全隱藏
            if (badgeIndex === 5 && obj.nm === 'Layer 17') {
                if (obj.ks && obj.ks.o) {
                    obj.ks.o.k = 0;
                    if (Array.isArray(obj.ks.o.k)) {
                        obj.ks.o.k = 0;
                    }
                } else {
                    obj.ks = obj.ks || {};
                    obj.ks.o = { a: 0, k: 0 };
                }
            }

            // 如果是第 6 個徽章 (badgeIndex === 5) 且是 Layer 15 (原圖中的 "OR" 字樣圖層)，將其完全隱藏
            if (badgeIndex === 5 && obj.nm === 'Layer 15') {
                if (obj.ks && obj.ks.o) {
                    obj.ks.o.k = 0;
                    if (Array.isArray(obj.ks.o.k)) {
                        obj.ks.o.k = 0;
                    }
                } else {
                    obj.ks = obj.ks || {};
                    obj.ks.o = { a: 0, k: 0 };
                }
            }

            // 處理 Stroke (ty: "st")
            if (obj.ty === 'st' && obj.c) {
                const isWhite = isColorWhite(obj.c);
                if (mode === 'clean' && !isWhite) {
                    // 俐落版且非白色：隱藏線條
                    if (obj.o) {
                        obj.o.k = 0;
                        if (Array.isArray(obj.o.k)) {
                            obj.o.k.forEach(kf => {
                                if (kf.s !== undefined) kf.s = 0;
                                if (kf.e !== undefined) kf.e = 0;
                            });
                        }
                    } else {
                        obj.o = { a: 0, k: 0 };
                    }
                    
                    if (obj.w) {
                        obj.w.k = 0;
                        if (Array.isArray(obj.w.k)) {
                            obj.w.k.forEach(kf => {
                                if (kf.s !== undefined) kf.s = 0;
                                if (kf.e !== undefined) kf.e = 0;
                            });
                        }
                    } else {
                        obj.w = { a: 0, k: 0 };
                    }
                } else {
                    // 完整版，或者是俐落版中的白色線條：設為純黑
                    if (Array.isArray(obj.c.k)) {
                        if (typeof obj.c.k[0] === 'number') {
                            obj.c.k = [0, 0, 0, 1]; // [R, G, B, A] 設為純黑
                        } else {
                            obj.c.k.forEach(kf => {
                                if (kf.s && Array.isArray(kf.s)) kf.s = [0, 0, 0, 1];
                                if (kf.e && Array.isArray(kf.e)) kf.e = [0, 0, 0, 1];
                            });
                        }
                    }
                }
            }

            // 處理 Fill (ty: "fl")
            if (obj.ty === 'fl' && obj.c) {
                if (Array.isArray(obj.c.k)) {
                    if (typeof obj.c.k[0] === 'number') {
                        obj.c.k = [1, 1, 1, 1]; 
                    } else {
                        obj.c.k.forEach(kf => {
                            if (kf.s && Array.isArray(kf.s)) kf.s = [1, 1, 1, 1];
                            if (kf.e && Array.isArray(kf.e)) kf.e = [1, 1, 1, 1];
                        });
                    }
                }
            }

            // 遞迴遍歷所有子物件
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    convertToBlackAndWhite(obj[key], mode, badgeIndex);
                }
            }
        }

        // 初始化 Lottie 實例列表
        const animInstances = [];
        const processedBadgeData = [];
        let currentStyleMode = 'full';

        // 複製並處理資料的函數
        function processBadgeData() {
            processedBadgeData.length = 0;
            rawBadgeData.forEach((data, index) => {
                const copy = JSON.parse(JSON.stringify(data));
                convertToBlackAndWhite(copy, currentStyleMode, index);
                processedBadgeData.push(copy);
            });
        }

        // 載入動畫
        function initAnimations() {
            // 清理舊實例
            animInstances.forEach(inst => inst.destroy());
            animInstances.length = 0;

            for (let i = 1; i <= 6; i++) {
                const container = document.getElementById('badge-' + i);
                if (i === 4) {
                    container.innerHTML = '<div class="jesus-text-overlay-4">耶穌</div>';
                } else if (i === 5) {
                    container.innerHTML = '<div class="jesus-text-overlay-5">耶穌</div>';
                } else if (i === 6) {
                    container.innerHTML = `
                        <div class="or-text-overlay">還是</div>
                        <div class="jesus-text-overlay-6">耶穌</div>
                    `;
                } else {
                    container.innerHTML = '';
                }

                const anim = lottie.loadAnimation({
                    container: container,
                    renderer: 'svg',
                    loop: false,
                    autoplay: false,
                    animationData: processedBadgeData[i - 1]
                });

                anim.addEventListener('DOMLoaded', () => {
                    // 固定至最後一影格（動畫完成狀態）
                    anim.goToAndStop(anim.totalFrames - 1, true);
                    
                    // 套用目前的線條粗細
                    applyStrokeWidthToDOM(document.getElementById('stroke-slider').value / 100);
                });

                animInstances.push(anim);
            }
        }

        // 遍歷實時微調 SVG 的 stroke-width
        function applyStrokeWidthToDOM(factor) {
            for (let i = 1; i <= 6; i++) {
                const container = document.getElementById('badge-' + i);
                const paths = container.querySelectorAll('path[stroke]');
                paths.forEach(path => {
                    // 保存原始 stroke-width
                    if (!path.dataset.originalStrokeWidth) {
                        path.dataset.originalStrokeWidth = path.getAttribute('stroke-width') || '1';
                    }
                    const orig = parseFloat(path.dataset.originalStrokeWidth);
                    path.setAttribute('stroke-width', orig * factor);
                });
            }
        }

        // 更新線條粗細
        function updateStroke(val) {
            const factor = val / 100;
            document.getElementById('stroke-val').innerText = factor.toFixed(1) + 'x';
            applyStrokeWidthToDOM(factor);
        }

        // 設定樣式模式 (完整版 vs 俐落版)
        function setStyleMode(mode) {
            if (currentStyleMode === mode) return;
            currentStyleMode = mode;
            
            const btnFull = document.getElementById('btn-style-full');
            const btnClean = document.getElementById('btn-style-clean');
            
            if (mode === 'full') {
                btnFull.classList.add('active');
                btnClean.classList.remove('active');
            } else {
                btnFull.classList.remove('active');
                btnClean.classList.add('active');
            }
            
            processBadgeData();
            initAnimations();
            
            // 延遲更新線條寬度追蹤以防 SVG 還沒生成
            setTimeout(() => {
                applyStrokeWidthToDOM(document.getElementById('stroke-slider').value / 100);
            }, 300);
        }

        // 設定紙張方向
        function setOrientation(orientation) {
            const page = document.getElementById('a4-page');
            const btnLandscape = document.getElementById('btn-landscape');
            const btnPortrait = document.getElementById('btn-portrait');

            if (orientation === 'landscape') {
                page.className = 'a4-page landscape';
                btnLandscape.classList.add('active');
                btnPortrait.classList.remove('active');
                updatePageStyle('landscape');
            } else {
                page.className = 'a4-page portrait';
                btnLandscape.classList.remove('active');
                btnPortrait.classList.add('active');
                updatePageStyle('portrait');
            }
        }

        // 當動畫渲染後，初始化原始線條寬度記錄
        function setupDOMStrokeTracking() {
            setTimeout(() => {
                applyStrokeWidthToDOM(document.getElementById('stroke-slider').value / 100);
            }, 300);
        }

        function updatePageStyle(orientation) {
            let styleEl = document.getElementById('page-orientation-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'page-orientation-style';
                document.head.appendChild(styleEl);
            }
            styleEl.innerHTML = `@media print { @page { size: A4 ${orientation}; margin: 0; } }`;
        }

        // 啟動
        window.addEventListener('DOMContentLoaded', () => {
            initTitles();
            processBadgeData();
            initAnimations();
            updatePageStyle('landscape'); // 預設橫向
            setTimeout(setupDOMStrokeTracking, 500);
        });
    </script>
