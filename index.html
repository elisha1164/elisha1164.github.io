<!-- 
  版本號：v1.2
  修改主旨：
  1. 將 category 改為 tags 陣列架構
  2. 實作動態標籤篩選列 (Filter Bar)
  3. 卡片內新增 tags 視覺呈現 (Pill Badges)
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老張工具間 | The Remnant Tinkers</title>
    
    <!-- Favicon (Lucide Wrench Icon in SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2323201e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/></svg>">
    
    <!-- SEO & Social Sharing Meta Tags -->
    <meta name="description" content="老張敲敲打打，弄出了一些靈修輔助小程式，期盼能幫助神的百姓，將生命單單建造在神的話語之上。聖經本位 x 科技助攻 x 踏實操練。">
    <meta name="keywords" content="基督教, 靈修, 讀經計畫, 背經, 改革宗, 老張讀書筆記, The Remnant, 神學">
    <meta property="og:title" content="老張工具間 | The Remnant Tinkers">
    <meta property="og:description" content="老張敲敲打打，弄出了一些靈修輔助小程式，期盼能幫助神的百姓，將生命單單建造在神的話語之上。">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#e6f7f5',
                            DEFAULT: '#72c4b9', // Tiffany-like blue/green
                            dark: '#4a9c92',
                        },
                        stone: {
                            850: '#23201e',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'ui-serif', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap');
        body {
            background-color: #faf9f6; /* Warm off-white */
            color: #23201e;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">
    
    <!-- Background Decoration -->
    <div class="absolute top-0 w-full h-80 bg-brand-light -z-10" style="clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);"></div>

    <!-- Header / Hero Section -->
    <header class="container mx-auto px-6 pt-16 pb-12 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-stone-850 text-white mb-6 shadow-lg">
            <i data-lucide="wrench" class="w-10 h-10"></i>
        </div>
        <h1 class="text-4xl md:text-5xl font-serif font-black tracking-wider text-stone-850 mb-2">
            老張工具間
        </h1>
        <h2 class="text-xl md:text-2xl font-bold text-stone-500 tracking-widest mb-6">
            The Remnant Tinkers
        </h2>
        <div class="inline-block bg-stone-850 text-brand-light px-6 py-2 rounded-full font-medium text-sm md:text-base tracking-wide shadow-md">
            聖經本位 &times; 科技助攻 &times; 踏實操練
        </div>
    </header>

    <!-- About Section -->
    <section class="container mx-auto px-6 max-w-3xl mb-12 text-center relative">
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-brand-light opacity-50 z-0">
            <i data-lucide="quote" class="w-24 h-24"></i>
        </div>
        <p class="text-lg text-stone-600 leading-relaxed relative z-10 font-medium px-4 md:px-12">
            「老張敲敲打打，弄出了一些靈修輔助小程式，期盼能幫助神的百姓，將生命單單建造在神的話語之上。」
        </p>
    </section>

    <!-- Tools Grid & Filter -->
    <main class="container mx-auto px-6 max-w-5xl flex-grow mb-20">
        <!-- 標籤篩選列 -->
        <div id="filter-container" class="flex flex-wrap gap-2 mb-8 justify-center">
            <!-- 篩選按鈕將由 JavaScript 動態載入於此處 -->
        </div>

        <div id="tools-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 應用程式卡片將由 JavaScript 動態載入於此處 -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-850 text-stone-400 py-8 text-center text-sm">
        <div class="container mx-auto px-6">
            <p>願上帝在教會中，並在基督耶穌裏，得著榮耀，直到世世代代，永永遠遠。阿們！</p>
            <p class="mt-2 text-stone-500">老張工具間 The Remnant Tinkers</p>
        </div>
    </footer>

    <!-- Initialize App Logic -->
    <script>
        let allToolsData = [];
        let currentFilter = '全部';

        document.addEventListener('DOMContentLoaded', () => {
            fetch('contents.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    allToolsData = data;
                    renderFilterBar();
                    renderTools();
                })
                .catch(error => {
                    console.error('載入內容失敗:', error);
                    document.getElementById('tools-container').innerHTML = '<p class="text-center text-red-500 col-span-full">無法載入工具列表，請確認伺服器環境或檔案路徑是否正確。</p>';
                });
        });

        // 渲染標籤篩選列
        function renderFilterBar() {
            const filterContainer = document.getElementById('filter-container');
            const tagsSet = new Set();
            
            // 提取所有不重複的標籤
            allToolsData.forEach(tool => {
                if (tool.tags && Array.isArray(tool.tags)) {
                    tool.tags.forEach(tag => tagsSet.add(tag));
                }
            });
            const uniqueTags = Array.from(tagsSet);
            
            // 定義狀態樣式
            const activeClass = 'bg-stone-800 text-white shadow-md';
            const inactiveClass = 'bg-white text-stone-500 border border-stone-200 hover:bg-stone-100 hover:text-stone-800';

            let html = `<button onclick="setFilter('全部')" class="px-5 py-2 rounded-full text-sm font-bold transition-all duration-200 ${currentFilter === '全部' ? activeClass : inactiveClass}">全部</button>`;
            
            uniqueTags.forEach(tag => {
                html += `<button onclick="setFilter('${tag}')" class="px-5 py-2 rounded-full text-sm font-bold transition-all duration-200 ${currentFilter === tag ? activeClass : inactiveClass}">${tag}</button>`;
            });
            
            filterContainer.innerHTML = html;
        }

        // 設定篩選條件並重新渲染
        window.setFilter = function(tag) {
            currentFilter = tag;
            renderFilterBar();
            renderTools();
        };

        // 渲染應用程式卡片
        function renderTools() {
            const container = document.getElementById('tools-container');
            
            // 過濾資料
            const filteredData = currentFilter === '全部' 
                ? allToolsData 
                : allToolsData.filter(tool => tool.tags && tool.tags.includes(currentFilter));
            
            let html = '';
            
            filteredData.forEach(tool => {
                // 產生卡片標籤 HTML
                const tagsHtml = tool.tags ? tool.tags.map(tag => 
                    `<span class="inline-block bg-brand-light text-brand-dark text-xs px-2.5 py-1 rounded-md mr-2 mb-2 font-medium tracking-wide">#${tag}</span>`
                ).join('') : '';

                html += `
                <article class="bg-white rounded-2xl p-8 shadow-sm border border-stone-100 card-hover flex flex-col h-full animate-[fadeIn_0.3s_ease-out]">
                    <div class="flex items-start mb-4">
                        <div class="w-12 h-12 rounded-xl bg-brand-light text-brand-dark flex items-center justify-center mr-4 shrink-0">
                            <i data-lucide="${tool.icon}" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-stone-850 leading-tight">${tool.title}</h3>
                            <span class="text-sm text-stone-400 font-normal">${tool.subtitle}</span>
                        </div>
                    </div>
                    
                    <h4 class="text-brand-dark font-medium mb-3">${tool.tagline}</h4>
                    
                    <div class="flex flex-wrap mb-2">
                        ${tagsHtml}
                    </div>
                    
                    <p class="text-stone-600 mb-6 flex-grow leading-relaxed text-sm md:text-base">
                        ${tool.description}
                    </p>
                    
                    <a href="${tool.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold py-3 px-4 rounded-xl transition-colors mt-auto">
                        <i data-lucide="${tool.buttonIcon}" class="w-5 h-5 mr-2"></i> ${tool.buttonText}
                    </a>
                </article>
                `;
            });
            
            // 若篩選後無結果的防呆處理
            if (filteredData.length === 0) {
                html = `<div class="col-span-full text-center py-12 text-stone-400 font-medium">沒有找到符合此標籤的工具。</div>`;
            }
            
            container.innerHTML = html;
            
            // 重新初始化 Lucide 圖示
            lucide.createIcons();
        }
    </script>
    
    <!-- 簡單的淡入動畫 -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
