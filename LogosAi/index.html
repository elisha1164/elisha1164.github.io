  <!-- FontAwesome Icons -->

  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* CSS Variables & Theme Tokens - Default Light Mode */
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --bg-sidebar: #f8fafc;
      --bg-sidebar-item: #ffffff;
      --bg-sidebar-active: #e2e8f0;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-gold: #b45309;
      --accent-gold-hover: #92400e;
      --accent-gold-light: rgba(180, 83, 9, 0.1);
      --accent-blue: #0284c7;
      --user-msg-bg: #dbeafe;
      --user-msg-text: #1e3a8a;
      --assistant-msg-bg: #ffffff;
      --assistant-msg-text: #0f172a;
      --scripture-bg: #fffbe6;
      --scripture-border: #b45309;
      --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    html.dark {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-sidebar: #0f172a;
      --bg-sidebar-item: #1e293b;
      --bg-sidebar-active: #334155;
      --bg-card: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-gold: #d97706;
      --accent-gold-hover: #b45309;
      --accent-gold-light: rgba(217, 119, 6, 0.15);
      --accent-blue: #38bdf8;
      --user-msg-bg: #1e3a8a;
      --user-msg-text: #eff6ff;
      --assistant-msg-bg: #1e293b;
      --assistant-msg-text: #f8fafc;
      --scripture-bg: rgba(217, 119, 6, 0.08);
      --scripture-border: #d97706;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Global Reset - Performance First: Zero Micro-Animations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: none !important;
      animation: none !important;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      height: 60px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #d97706, #92400e);
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .brand-title h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .brand-title p {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-icon:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* App Main Layout with Sidebar */
    .app-body {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px);
      height: calc(100dvh - 60px);
      position: relative;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 15;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-new-chat {
      width: 100%;
      padding: 10px 14px;
      background: var(--accent-gold);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-new-chat:hover {
      background: var(--accent-gold-hover);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-sidebar-item);
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text-primary);
    }

    .session-item:hover, .session-item.active {
      background: var(--bg-sidebar-active);
      border-color: var(--accent-gold);
    }

    .session-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .session-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.7;
    }

    .session-item:hover .session-item-actions {
      opacity: 1;
    }

    .btn-session-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
    }

    .btn-session-action:hover {
      color: var(--accent-gold);
    }

    .btn-session-action.delete:hover {
      color: #ef4444;
    }

    /* Mobile Sidebar Overlay */
    .sidebar-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 12;
    }

    /* Chat Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background-color: var(--bg-primary);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* Welcome / Empty State */
    .welcome-card {
      text-align: center;
      margin: auto;
      padding: 28px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 600px;
    }

    .welcome-card i.fa-cross {
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin-bottom: 12px;
    }

    .welcome-card h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .welcome-card p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .sample-prompts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px;
      text-align: left;
    }

    .sample-prompt-btn {
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sample-prompt-btn:hover {
      border-color: var(--accent-gold);
      background: var(--accent-gold-light);
    }

    .sample-prompt-btn i {
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      font-weight: 600;
    }

    .message-row.user .avatar {
      background: #2563eb;
      color: #ffffff;
    }

    .message-row.assistant .avatar {
      background: linear-gradient(135deg, #d97706, #78350f);
      color: #ffffff;
    }

    .bubble-content {
      max-width: 84%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.65;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .message-row.user .bubble-content {
      background-color: var(--user-msg-bg);
      color: var(--user-msg-text);
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .bubble-content {
      background-color: var(--assistant-msg-bg);
      color: var(--assistant-msg-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      font-family: 'Noto Serif TC', serif;
    }

    .bubble-content h1, .bubble-content h2, .bubble-content h3 {
      font-family: 'Noto Serif TC', serif;
      margin-top: 12px;
      margin-bottom: 6px;
      color: var(--accent-gold);
    }

    .bubble-content p {
      margin-bottom: 10px;
    }

    .bubble-content p:last-child {
      margin-bottom: 0;
    }

    .bubble-content blockquote {
      background: var(--scripture-bg);
      border-left: 4px solid var(--scripture-border);
      padding: 10px 14px;
      margin: 12px 0;
      border-radius: 0 8px 8px 0;
      font-family: 'Noto Serif TC', serif;
      color: var(--text-primary);
    }

    .bubble-content ul, .bubble-content ol {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .bubble-content li {
      margin-bottom: 4px;
    }

    .bubble-content code {
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.88rem;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    .btn-copy-msg {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .btn-copy-msg:hover {
      color: var(--accent-gold);
      background: var(--accent-gold-light);
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-gold);
      border-radius: 50%;
    }

    /* Input Footer Container */
    .input-container {
      padding: 12px 16px 16px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .input-box-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 12px;
    }

    .input-box-wrapper:focus-within {
      border-color: var(--accent-gold);
    }

    textarea#user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
      padding: 4px 0;
    }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--accent-gold);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .btn-send:hover {
      background: var(--accent-gold-hover);
    }

    .btn-send:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .share-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .share-option-btn {
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .share-option-btn:hover {
      border-color: var(--accent-gold);
      background: var(--accent-gold-light);
    }

    .share-option-btn i {
      color: var(--accent-gold);
      font-size: 1rem;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        top: 0;
        left: -260px;
        height: 100%;
        box-shadow: 4px 0 12px rgba(0, 0, 0, 0.15);
      }
      .sidebar.open {
        left: 0;
      }
      .sidebar-overlay.active {
        display: block;
      }
      .bubble-content { max-width: 90%; }
      .welcome-card { padding: 20px 16px; }
    }
  </style>
</head>
<body class="light">

  <!-- Header -->
  <header>
    <div class="brand">
      <button class="btn-icon" id="btn-toggle-sidebar" title="切換會話欄">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="brand-icon">
        <i class="fa-solid fa-book-bible"></i>
      </div>
      <div class="brand-title">
        <h1>LogosAI</h1>
        <p>高舉聖經 ‧ 研討真理</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-install-pwa" title="安裝 App" style="display: none; background: var(--accent-gold-light); color: var(--accent-gold); border-color: var(--accent-gold); font-size: 1.1rem;">
        📲
      </button>
      <button class="btn-icon" id="btn-theme" title="切換深色/淺色主題">
        <i class="fa-solid fa-sun"></i>
      </button>
      <button class="btn-icon" id="btn-share" title="分享此對話">
        <i class="fa-solid fa-share-nodes"></i>
      </button>
    </div>
  </header>

  <!-- App Main Layout with Sidebar -->
  <div class="app-body">
    <!-- Sidebar for Multi-Session Management -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button class="btn-new-chat" id="btn-new-chat">
          <i class="fa-solid fa-plus"></i> 新建對話
        </button>
      </div>
      <div class="session-list" id="session-list">
        <!-- Sessions inserted dynamically -->
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Chat Area -->
    <main>
      <div id="chat-container">
        <!-- Welcome Card (shown when empty) -->
        <div class="welcome-card" id="welcome-card">
          <i class="fa-solid fa-cross"></i>
          <h2>歡迎使用 LogosAI 聖經神學助手</h2>
          <p>LogosAI 高舉聖經最高權威，結合 AI 科技與聖經經文，為您提供嚴謹、全面且以經文佐證的神學解答。請在下方輸入您的問題。</p>
          <div class="sample-prompts">
            <button class="sample-prompt-btn" data-prompt="如果神是全能又愛我們的，為什麼世界上會有苦難與不公平？">
              <i class="fa-solid fa-circle-question"></i>
              信仰困惑：苦難與上帝的愛
            </button>
            <button class="sample-prompt-btn" data-prompt="讀聖經遇到看不懂或覺得矛盾的地方，應該如何理解？">
              <i class="fa-solid fa-circle-question"></i>
              讀經疑難：如何面對難解經文
            </button>
            <button class="sample-prompt-btn" data-prompt="基督徒在日常生活與課業/工作中，如何尋求神的旨意？">
              <i class="fa-solid fa-circle-question"></i>
              生活實踐：尋求神的旨意
            </button>
          </div>
        </div>
      </div>

      <!-- Input Footer -->
      <div class="input-container">
        <div class="input-box-wrapper">
          <textarea id="user-input" placeholder="請輸入您的神學或聖經問題... (Enter 發送，Shift+Enter 換行)" rows="1"></textarea>
          <button class="btn-send" id="btn-send" title="發送訊息">

  <!-- Share Modal (Desktop Fallback) -->
  <div class="modal-overlay" id="modal-share">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-share-nodes" style="color: var(--accent-gold); margin-right: 8px;"></i>匯出與分享此對話</h3>

          <i class="fa-solid fa-mobile-screen"></i>

          <i class="fa-solid fa-file-code"></i>
          <span>下載 Markdown 格式紀錄 (.md)</span>

        <button class="share-option-btn" id="share-download-txt">
          <i class="fa-solid fa-file-lines"></i>
          <span>下載 純文字格式紀錄 (.txt)</span>

  <!-- iOS PWA Install Guide Modal -->
  <div class="modal-overlay" id="modal-ios-install">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-brands fa-apple" style="color: var(--accent-gold); margin-right: 8px;"></i>安裝 LogosAI 至 iOS 主畫面</h3>
        <button class="btn-icon" id="btn-close-ios-guide" style="width: 32px; height: 32px;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="font-size: 0.9rem; line-height: 1.8; color: var(--text-secondary);">
        <p style="margin-bottom: 12px;">將 LogosAI 新增至 iPhone / iPad 主畫面，獲得全螢幕獨立 App 級體驗：</p>
        <ol style="margin-left: 20px; margin-bottom: 16px;">
          <li style="margin-bottom: 8px;">請確定使用 <strong>Safari 瀏覽器</strong> 開啟本網頁</li>
          <li style="margin-bottom: 8px;">點擊 Safari 底部工具列中央的 <strong>「分享」圖示</strong> <i class="fa-solid fa-arrow-up-from-bracket" style="color: var(--accent-gold);"></i></li>
          <li style="margin-bottom: 8px;">選單向上滑動，選擇 <strong>「加入主畫面」</strong> <i class="fa-solid fa-square-plus" style="color: var(--accent-gold);"></i></li>
        </ol>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-dismiss-ios-guide" style="width: 100%;">知道了！</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Application Logic JavaScript -->
  <script>
    /* Global Variables & State */
    const DEFAULT_PROXY_URL = 'https://logos-ai-proxy.your-subdomain.workers.dev';
    
    let sessions = []; // [{ id, title, createdAt, updatedAt }]
    let currentSessionId = null;
    let currentMessages = []; // [{ id, sessionId, role, content }]
    
    let db = null;
    const DB_NAME = 'LogosAIChatDB_v2';
    const DB_VERSION = 1;
    const STORE_SESSIONS = 'sessions';
    const STORE_MESSAGES = 'messages';

    // DOM Elements
    const chatContainer = document.getElementById('chat-container');
    const welcomeCard = document.getElementById('welcome-card');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const btnTheme = document.getElementById('btn-theme');
    const btnShare = document.getElementById('btn-share');
    const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
    const btnNewChat = document.getElementById('btn-new-chat');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const sessionListEl = document.getElementById('session-list');
    const modalShare = document.getElementById('modal-share');

    /* Initialize Application */
    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      registerServiceWorker();
      await initDB();
      await loadSessionsFromDB();
      setupEventListeners();
      checkIOSPWA();
    });

    /* Register PWA Service Worker (sw.js) */
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Registered:', reg.scope))
            .catch(err => console.warn('Service Worker Registration Failed:', err));
        });
      }
    }

    /* Theme Initialization - Default Light Mode */
    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        btnTheme.innerHTML = '<i class="fa-solid fa-moon"></i>';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        btnTheme.innerHTML = '<i class="fa-solid fa-sun"></i>';
      }
    }

    btnTheme.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('app_theme', 'light');
        btnTheme.innerHTML = '<i class="fa-solid fa-sun"></i>';
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        localStorage.setItem('app_theme', 'dark');
        btnTheme.innerHTML = '<i class="fa-solid fa-moon"></i>';
      }
    });

    /* IndexedDB & LocalStorage Multi-Session Data Access */
    function initDB() {
      return new Promise((resolve) => {
        try {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (e) => {
            const dbInstance = e.target.result;
            if (!dbInstance.objectStoreNames.contains(STORE_SESSIONS)) {
              dbInstance.createObjectStore(STORE_SESSIONS, { keyPath: 'id' });
            }
            if (!dbInstance.objectStoreNames.contains(STORE_MESSAGES)) {
              const msgStore = dbInstance.createObjectStore(STORE_MESSAGES, { keyPath: 'id', autoIncrement: true });
              msgStore.createIndex('sessionId', 'sessionId', { unique: false });
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            resolve();
          };
          request.onerror = (e) => {
            console.warn('IndexedDB blocked, using LocalStorage fallback:', e.target.error);
            resolve();
          };
        } catch(err) {
          console.warn('IndexedDB unavailable, using LocalStorage fallback:', err);
          resolve();
        }
      });
    }

    async function loadSessionsFromDB() {
      if (db) {
        try {
          const tx = db.transaction(STORE_SESSIONS, 'readonly');
          const store = tx.objectStore(STORE_SESSIONS);
          const request = store.getAll();
          request.onsuccess = async () => {
            sessions = request.result || [];
            sessions.sort((a, b) => b.updatedAt - a.updatedAt);
            if (sessions.length === 0) {
              await createNewSession('新神學對話');
            } else {
              renderSessionListUI();
              await switchSession(sessions[0].id);
            }
          };
          return;
        } catch(e) {}
      }
      loadLocalStorageSessions();
    }

    function loadLocalStorageSessions() {
      try {
        const raw = localStorage.getItem('logos_sessions_backup');
        if (raw) {
          sessions = JSON.parse(raw) || [];
        }
      } catch(e) {}

      if (sessions.length === 0) {
        createNewSession('新神學對話');
      } else {
        renderSessionListUI();
        switchSession(sessions[0].id);
      }
    }

    async function createNewSession(customTitle = '新神學對話') {
      const newId = 'session_' + Date.now();
      const newSession = {
        id: newId,
        title: customTitle,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      sessions.unshift(newSession);

      if (db) {
        try {
          const tx = db.transaction(STORE_SESSIONS, 'readwrite');
          tx.objectStore(STORE_SESSIONS).put(newSession);
        } catch(e) {}
      }
      saveLocalStorageBackup();
      renderSessionListUI();
      await switchSession(newId);
    }

    async function switchSession(sessionId) {
      currentSessionId = sessionId;
      renderSessionListUI();
      await loadMessagesForSession(sessionId);
    }

    async function loadMessagesForSession(sessionId) {
      currentMessages = [];
      chatContainer.innerHTML = '';

      if (db) {
        try {
          const tx = db.transaction(STORE_MESSAGES, 'readonly');
          const store = tx.objectStore(STORE_MESSAGES);
          const index = store.index('sessionId');
          const request = index.getAll(sessionId);

          request.onsuccess = () => {
            currentMessages = request.result || [];
            renderCurrentChatUI();
          };
          return;
        } catch(e) {}
      }

      // LocalStorage Fallback
      try {
        const raw = localStorage.getItem(`logos_msg_${sessionId}`);
        if (raw) currentMessages = JSON.parse(raw) || [];
      } catch(e) {}
      renderCurrentChatUI();
    }

    function renderCurrentChatUI() {
      chatContainer.innerHTML = '';
      if (currentMessages.length === 0) {
        chatContainer.appendChild(welcomeCard);
        welcomeCard.style.display = 'block';
      } else {
        welcomeCard.style.display = 'none';
        currentMessages.forEach(msg => appendMessageUI(msg.role, msg.content));
      }
      smartScrollToBottom();
    }

    async function saveCurrentMessagesToDB() {
      if (db) {
        try {
          const tx = db.transaction([STORE_MESSAGES, STORE_SESSIONS], 'readwrite');
          const msgStore = tx.objectStore(STORE_MESSAGES);
          const sessionStore = tx.objectStore(STORE_SESSIONS);

          // Clear old messages for this session
          const index = msgStore.index('sessionId');
          const request = index.getAllKeys(currentSessionId);
          request.onsuccess = () => {
            const keys = request.result || [];
            keys.forEach(k => msgStore.delete(k));
            currentMessages.forEach(msg => {
              msgStore.add({ sessionId: currentSessionId, role: msg.role, content: msg.content, timestamp: Date.now() });
            });
          };

          // Update session updatedAt timestamp
          const targetSession = sessions.find(s => s.id === currentSessionId);
          if (targetSession) {
            targetSession.updatedAt = Date.now();
            sessionStore.put(targetSession);
          }
        } catch(e) {}
      }

      // LocalStorage Backup
      try {
        localStorage.setItem(`logos_msg_${currentSessionId}`, JSON.stringify(currentMessages));
      } catch(e) {}
      saveLocalStorageBackup();
    }

    function saveLocalStorageBackup() {
      try {
        localStorage.setItem('logos_sessions_backup', JSON.stringify(sessions));
      } catch(e) {}
    }

    async function renameSession(sessionId) {
      const target = sessions.find(s => s.id === sessionId);
      if (!target) return;

      const newTitle = prompt('請輸入新的會話名稱：', target.title);
      if (newTitle && newTitle.trim()) {
        target.title = newTitle.trim();
        target.updatedAt = Date.now();

        if (db) {
          try {
            const tx = db.transaction(STORE_SESSIONS, 'readwrite');
            tx.objectStore(STORE_SESSIONS).put(target);
          } catch(e) {}
        }
        saveLocalStorageBackup();
        renderSessionListUI();
        showToast('會話名稱已更新');
      }
    }

    async function deleteSession(sessionId, e) {
      if (e) e.stopPropagation();

      if (sessions.length <= 1) {
        // If only 1 session, clear its messages instead of deleting
        currentMessages = [];
        await saveCurrentMessagesToDB();
        renderCurrentChatUI();
        showToast('會話內容已重置');
        return;
      }

      if (!confirm('確定要刪除此會話嗎？')) return;

      sessions = sessions.filter(s => s.id !== sessionId);

      if (db) {
        try {
          const tx = db.transaction([STORE_SESSIONS, STORE_MESSAGES], 'readwrite');
          tx.objectStore(STORE_SESSIONS).delete(sessionId);
          const msgIndex = tx.objectStore(STORE_MESSAGES).index('sessionId');
          const req = msgIndex.getAllKeys(sessionId);
          req.onsuccess = () => {
            const keys = req.result || [];
            keys.forEach(k => tx.objectStore(STORE_MESSAGES).delete(k));
          };
        } catch(err) {}
      }

      try {
        localStorage.removeItem(`logos_msg_${sessionId}`);
      } catch(err) {}
      saveLocalStorageBackup();

      renderSessionListUI();
      if (currentSessionId === sessionId) {
        await switchSession(sessions[0].id);
      }
      showToast('會話已成功刪除');
    }

    function renderSessionListUI() {
      sessionListEl.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'session-title';
        titleSpan.textContent = s.title || '無標題對話';

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'session-item-actions';

        const btnRename = document.createElement('button');
        btnRename.className = 'btn-session-action';
        btnRename.innerHTML = '<i class="fa-regular fa-pen-to-square"></i>';
        btnRename.title = '重命名會話';
        btnRename.addEventListener('click', (e) => {
          e.stopPropagation();
          renameSession(s.id);
        });

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-session-action delete';
        btnDel.innerHTML = '<i class="fa-regular fa-trash-can"></i>';
        btnDel.title = '刪除會話';
        btnDel.addEventListener('click', (e) => deleteSession(s.id, e));

        actionsDiv.appendChild(btnRename);
        actionsDiv.appendChild(btnDel);

        item.appendChild(titleSpan);
        item.appendChild(actionsDiv);

        item.addEventListener('click', () => {
          if (currentSessionId !== s.id) {
            switchSession(s.id);
            if (window.innerWidth <= 768) {
              sidebar.classList.remove('open');
              sidebarOverlay.classList.remove('active');
            }
          }
        });

        sessionListEl.appendChild(item);
      });
    }

    /* Event Listeners Setup */
    function setupEventListeners() {
      // Sidebar Toggle
      btnToggleSidebar.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      });

      sidebarOverlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      });

      btnNewChat.addEventListener('click', () => {
        createNewSession();
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        }
      });

      // Auto resize textarea
      userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
      });

      // Send on Enter
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      btnSend.addEventListener('click', sendMessage);

      // Sample prompt buttons
      document.querySelectorAll('.sample-prompt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const prompt = btn.getAttribute('data-prompt');
          userInput.value = prompt;
          userInput.style.height = 'auto';
          userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
          sendMessage();
        });
      });

      // Share Modal
      btnShare.addEventListener('click', openShareModal);
      document.getElementById('btn-close-share').addEventListener('click', () => modalShare.classList.remove('active'));

      document.getElementById('share-native').addEventListener('click', triggerNativeShare);
      document.getElementById('share-copy').addEventListener('click', copyConversationToClipboard);
      document.getElementById('share-download-md').addEventListener('click', () => downloadFile('md'));
      document.getElementById('share-download-txt').addEventListener('click', () => downloadFile('txt'));

      // PWA Install Button Handler
      const btnInstallPwa = document.getElementById('btn-install-pwa');
      if (btnInstallPwa) {
        btnInstallPwa.addEventListener('click', handlePWAInstallClick);
      }

      // iOS PWA Modal Dismiss Handlers
      const closeIOSModal = () => {
        document.getElementById('modal-ios-install').classList.remove('active');
      };
      document.getElementById('btn-close-ios-guide').addEventListener('click', closeIOSModal);
      document.getElementById('btn-dismiss-ios-guide').addEventListener('click', closeIOSModal);
    }

    /* PWA Install Logic */
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btnInstall = document.getElementById('btn-install-pwa');
      if (btnInstall) btnInstall.style.display = 'flex';
    });

    function checkIOSPWA() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      if (isIOS && !isStandalone) {
        const btnInstall = document.getElementById('btn-install-pwa');
        if (btnInstall) btnInstall.style.display = 'flex';
      }
    }

    function handlePWAInstallClick() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        document.getElementById('modal-ios-install').classList.add('active');
      } else if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            showToast('感謝安裝 LogosAI！');
            const btnInstall = document.getElementById('btn-install-pwa');
            if (btnInstall) btnInstall.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        showToast('請使用瀏覽器選單點擊「安裝」或「加到主畫面」');
      }
    }

    function smartScrollToBottom() {
      const distanceToBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
      if (distanceToBottom < 160) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    /* Append Message to UI */
    function appendMessageUI(role, content) {
      welcomeCard.style.display = 'none';

      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = role === 'user' 
        ? '<i class="fa-solid fa-user"></i>' 
        : '<i class="fa-solid fa-book-bible"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'bubble-content';

      if (role === 'assistant') {
        const textWrapper = document.createElement('div');
        textWrapper.className = 'msg-text-body';
        textWrapper.innerHTML = marked.parse(content || '');
        bubble.appendChild(textWrapper);

        if (content) {
          const actions = document.createElement('div');
          actions.className = 'bubble-actions';
          const copyBtn = document.createElement('button');
          copyBtn.className = 'btn-copy-msg';
          copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> 複製解答';
          copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(content).then(() => showToast('已複製解答內容'));
          });
          actions.appendChild(copyBtn);
          bubble.appendChild(actions);
        }
      } else {
        bubble.textContent = content;
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      smartScrollToBottom();
      return bubble;
    }

    /* Append Typing Indicator */
    function appendTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.id = 'typing-indicator-row';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = '<i class="fa-solid fa-book-bible"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'bubble-content';
      bubble.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      smartScrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator-row');
      if (indicator) indicator.remove();
    }

    /* Send Message Handler */
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const proxyUrl = localStorage.getItem('proxy_url') || DEFAULT_PROXY_URL;
      const directKey = localStorage.getItem('direct_api_key') || '';

      if (!proxyUrl && !directKey) {
        showToast('請先於程式碼中設定 Worker 網址');
        return;
      }

      // Auto Title generation for first message
      const currentSession = sessions.find(s => s.id === currentSessionId);
      if (currentSession && (currentSession.title === '新神學對話' || currentSession.title === '無標題對話') && currentMessages.length === 0) {
        currentSession.title = text.length > 18 ? text.substring(0, 18) + '...' : text;
        renderSessionListUI();
      }

      // Add user message to history & UI
      currentMessages.push({ role: 'user', content: text });
      appendMessageUI('user', text);
      await saveCurrentMessagesToDB();

      userInput.value = '';
      userInput.style.height = 'auto';
      btnSend.disabled = true;

      appendTypingIndicator();

      try {
        let replyText = '';
        const model = 'gemini-3.6-flash';

        if (proxyUrl) {
          const response = await fetch(proxyUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: model,
              messages: currentMessages
            })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          replyText = data.choices[0].message.content;

        } else if (directKey) {
          const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${directKey}`;
          const contents = currentMessages.map(msg => ({
            role: msg.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: msg.content }]
          }));

          const response = await fetch(geminiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: contents
            })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error?.message || `HTTP ${response.status}`);
          }
          replyText = data.candidates[0].content.parts.map(p => p.text).join('');
        }

        removeTypingIndicator();

        // Typewriter animation effect
        currentMessages.push({ role: 'assistant', content: replyText });
        await saveCurrentMessagesToDB();

        const bubble = appendMessageUI('assistant', '');
        const textBody = bubble.querySelector('.msg-text-body');
        let charIndex = 0;
        const step = Math.max(1, Math.floor(replyText.length / 80));
        
        const typeInterval = setInterval(() => {
          charIndex += step;
          if (charIndex >= replyText.length) {
            if (textBody) textBody.innerHTML = marked.parse(replyText);

            const actions = document.createElement('div');
            actions.className = 'bubble-actions';
            const copyBtn = document.createElement('button');
            copyBtn.className = 'btn-copy-msg';
            copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> 複製解答';
            copyBtn.addEventListener('click', () => {
              navigator.clipboard.writeText(replyText).then(() => showToast('已複製解答內容'));
            });
            actions.appendChild(copyBtn);
            bubble.appendChild(actions);

            clearInterval(typeInterval);
            smartScrollToBottom();
          } else {
            if (textBody) textBody.innerHTML = marked.parse(replyText.substring(0, charIndex) + '▌');
            smartScrollToBottom();
          }
        }, 15);

      } catch (err) {
        removeTypingIndicator();
        appendMessageUI('assistant', `⚠️ **請求發生錯誤**\n\n${err.message}`);
        console.error(err);
      } finally {
        btnSend.disabled = false;
      }
    }

    /* Share & Export Functions for Current Active Session */
    function openShareModal() {
      if (currentMessages.length === 0) {
        showToast('目前會話尚無對話內容可供分享');
        return;
      }
      modalShare.classList.add('active');
    }

    function generateShareText() {
      const currentSession = sessions.find(s => s.id === currentSessionId);
      const title = currentSession ? currentSession.title : 'LogosAI 神學對話';
      let formatted = `📖 **LogosAI 聖經神學問答紀錄**\n主題：${title}\n日期：${new Date().toLocaleDateString('zh-TW')}\n-----------------------------------\n\n`;
      currentMessages.forEach(msg => {
        const roleName = msg.role === 'user' ? '👤 提問' : '📖 神學解答';
        formatted += `### ${roleName}:\n${msg.content}\n\n`;
      });
      return formatted;
    }

    async function triggerNativeShare() {
      const shareData = {
        title: 'LogosAI 聖經神學對話紀錄',
        text: generateShareText().substring(0, 1000) + '...',
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          modalShare.classList.remove('active');
          showToast('分享成功！');
        } catch (err) {
          if (err.name !== 'AbortError') {
            copyConversationToClipboard();
          }
        }
      } else {
        copyConversationToClipboard();
      }
    }

    function copyConversationToClipboard() {
      const fullText = generateShareText();
      navigator.clipboard.writeText(fullText).then(() => {
        modalShare.classList.remove('active');
        showToast('對話全文已成功複製至剪貼簿！');
      }).catch(err => {
        showToast('複製失敗，請手動全選複製');
      });
    }

    function downloadFile(format) {
      const currentSession = sessions.find(s => s.id === currentSessionId);
      const title = currentSession ? currentSession.title.replace(/[\/\\?%*:|"<>]/g, '_') : 'LogosAI_Chat';
      const content = generateShareText();
      const filename = `LogosAI_${title}.${format}`;
      const mimeType = format === 'md' ? 'text/markdown' : 'text/plain';

      const blob = new Blob([content], { type: `${mimeType};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      modalShare.classList.remove('active');
      showToast(`已成功下載 ${filename}`);
    }

    /* Toast Notification Helper */
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
