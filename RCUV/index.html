<!DOCTYPE html>
<!-- 
  版本號：v1.46
  修改主旨：
  1. 修正多卡片情境下的「分享 / 複製文字」結構與邏輯：
     - 於 #btn-share 處理常式改為遍歷 cardStates 陣列進行段落與經文萃取。
     - 在各層級卡片內容前方加上標題資訊（如：【創世記 1:1-5】），並且在多張卡片間以空行分隔，維持明確可讀性。
     - 廢除無條件的 200 字元截斷限制，保留足本經文結構分享與複製處理。
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>和合本 2010</title>
    
    <!-- Open Graph Tags for Social Media Sharing -->
    <meta property="og:title" content="📖 和合本 2010">
    <meta property="og:description" content="輕量的聖經app，能夠朗讀經文、一鍵製作 PPT。">
    <meta property="og:type" content="website">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafaf9">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <!-- iOS PWA 專用標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="和合本 2010">
    <link rel="apple-touch-icon" href="icon-180.png">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- localforage (CDN) 用於 IndexedDB 封裝 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <!-- PptxGenJS (純前端匯出 PPTX 簡報) - 主要來源 -->
    <script src="https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <!-- PptxGenJS - 備援機制 (Fallback) -->
    <script>
        if (typeof window.pptxgen === 'undefined' && typeof window.PptxGenJS === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"><\/script>');
        }
    </script>

    <!-- 防範 LINE/FB 內建瀏覽器強制跳出機制 -->
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf('Line') > -1 || ua.indexOf('LINE') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('FBAN') > -1) {
                if (window.location.search.indexOf('openExternalBrowser=1') === -1) {
                    var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(window.location.href + sep + 'openExternalBrowser=1');
                }
            }
        })();
    </script>
    
    <style>
        /* 書卷縮寫視圖切換 (Abbreviation View Toggle) */
        #book-modal-body .abbrev-view { display: none; }
        #book-modal-body.abbrev-mode .abbrev-view { display: flex; }
        #book-modal-body .normal-view { display: block; }
        #book-modal-body.abbrev-mode .normal-view { display: none; }

        /* 中英對照視圖切換 (Bilingual View Toggle) */
        #cards-container .esv-text { display: none; }
        #cards-container.bilingual-mode .esv-text { display: block; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen pb-12">

    <!-- 頂部固定導航功能列 (恆常可見、居中對齊常規功能) -->
    <header id="main-header" class="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-sm transition-all duration-300">
        <div class="max-w-4xl mx-auto px-4 py-2.5 flex justify-center items-center">
            <div class="flex items-center gap-1 sm:gap-2 justify-center shrink-0 flex-wrap">
                <!-- 播放控制按鈕 -->
                <button id="btn-play" class="p-2 rounded-full bg-amber-600 hover:bg-amber-700 text-white shadow-sm transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" title="朗讀全部卡片">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                </button>
                <button id="btn-pause" class="hidden p-2 rounded-full bg-stone-800 hover:bg-stone-900 text-white shadow-sm transition transform active:scale-95" title="暫停">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                </button>
                <button id="btn-resume" class="hidden p-2 rounded-full bg-amber-600 hover:bg-amber-700 text-white shadow-sm transition transform active:scale-95" title="繼續">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                </button>
                <button id="btn-stop" class="hidden p-2 rounded-full bg-red-100 hover:bg-red-200 text-red-700 shadow-sm transition transform active:scale-95" title="停止">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>
                </button>
                <button id="btn-loop" class="hidden p-2 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 shadow-sm transition transform active:scale-95" title="循環播放：關閉">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                </button>

                <!-- 分隔線 -->
                <div class="w-px h-5 bg-stone-300 mx-0.5 sm:mx-1"></div>

                <!-- 英譯本對照按鈕 -->
                <button id="btn-bilingual" class="w-9 h-9 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition flex items-center justify-center font-bold text-sm shrink-0" title="英譯本 ESV 對照 (全區)">英</button>

                <!-- 匯出簡報按鈕 -->
                <button id="btn-export-ppt" class="p-2 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed shrink-0" title="匯出全體卡片為簡報 (PPTX)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1" ry="1"></rect><path stroke-linecap="round" stroke-linejoin="round" d="M8 20h8m-4-4v4"></path></svg>
                </button>

                <!-- 分享/複製按鈕 -->
                <button id="btn-share" class="p-2 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition shrink-0" title="分享與複製">
                    <svg id="icon-share" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    <svg id="icon-copy" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                
                <!-- 設定按鈕與下拉選單容器 -->
                <div class="relative shrink-0" id="settings-container">
                    <button id="btn-settings" class="p-2 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition" title="系統設定">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    
                    <!-- 設定下拉選單 -->
                    <div id="settings-dropdown" class="hidden absolute right-0 sm:left-1/2 sm:-translate-x-1/2 mt-2 w-64 bg-white rounded-xl shadow-lg border border-stone-200 p-4 z-50 text-left">
                        <div class="mb-4">
                            <label class="block text-sm font-bold text-stone-600 mb-2">🗣️ 系統語音</label>
                            <select id="voice-select" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none transition bg-stone-50 text-stone-800 font-medium text-sm">
                                <option value="">(系統無可用中文語音)</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="block text-sm font-bold text-stone-600 mb-2">⏱️ 朗讀語速</label>
                            <select id="rate-select" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none transition bg-stone-50 text-stone-800 font-medium text-sm">
                                <option value="0.8">慢速 (0.8x)</option>
                                <option value="1.0" selected>正常 (1.0x)</option>
                                <option value="1.2">稍快 (1.2x)</option>
                                <option value="1.5">快速 (1.5x)</option>
                            </select>
                        </div>

                        <!-- PWA 安裝按鈕 -->
                        <button id="btn-install-pwa" class="hidden w-full bg-amber-100 text-amber-800 py-2 mt-4 rounded-lg hover:bg-amber-200 transition font-bold text-sm flex items-center justify-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            安裝到桌面
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 全域狀態列 -->
        <div id="status-bar" class="w-full bg-amber-100 text-amber-800 text-sm font-bold text-center py-2 transition-all">
            ⏳ 系統初始化與資料載入中...
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- 經文多卡片容器 -->
        <div id="cards-container" class="flex flex-col">
            <article class="scripture-card min-h-[calc(100vh-4rem)] bg-white rounded-2xl shadow-sm border border-stone-200 p-8 flex items-center justify-center text-stone-400 text-lg font-serif">
                ⏳ 正在讀取並初始化聖經經文資料庫...
            </article>
        </div>

        <!-- 頁底「＋」號新增卡片觸發按鈕 -->
        <div class="flex justify-center mt-6 mb-8">
            <button onclick="addNewCard()" class="w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-600 text-white shadow-lg hover:shadow-xl flex items-center justify-center transition transform hover:scale-105 active:scale-95 outline-none focus:ring-4 focus:ring-amber-300" title="新增經文卡片 (預設創世記)">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-4 text-center text-stone-400 text-xs px-4 border-t border-stone-200 pt-6 pb-6">
        <a href="../index.html" target="_blank" class="inline-flex items-center text-stone-500 hover:text-stone-700 transition-colors bg-stone-200/50 px-3 py-1.5 rounded-full">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
            老張工具間
        </a>
    </footer>

    <!-- 註釋彈出框 (Footnote Modal) -->
    <div id="footnote-modal" class="fixed inset-0 bg-stone-900/40 hidden flex items-center justify-center z-50 transition-opacity backdrop-blur-sm" onclick="if(event.target === this) toggleFootnoteModal()">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full mx-4 relative transform transition-transform scale-100">
            <button onclick="toggleFootnoteModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 transition bg-stone-100 hover:bg-stone-200 rounded-full p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="flex items-center mb-4">
                <span class="text-2xl mr-2">📝</span>
                <h4 class="font-bold text-stone-800 text-lg">經文註釋</h4>
            </div>
            <p id="footnote-content" class="text-stone-700 leading-relaxed bg-amber-50 p-4 rounded-xl border border-amber-100 text-lg font-serif"></p>
        </div>
    </div>

    <!-- PWA 安裝引導 Modal -->
    <div id="pwa-modal" class="fixed inset-0 bg-stone-900/60 hidden flex items-center justify-center z-[60] transition-opacity backdrop-blur-sm" onclick="if(event.target === this) closePwaModal()">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 relative transform transition-transform scale-100">
            <button onclick="closePwaModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 transition bg-stone-100 hover:bg-stone-200 rounded-full p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="flex flex-col items-center text-center pt-2">
                <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-4 shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </div>
                <h4 class="font-bold text-stone-800 text-lg mb-4">想要常常讀聖經嗎？</h4>
                
                <!-- 標準安裝模式 (Android / Desktop) -->
                <div id="pwa-standard-view" class="hidden w-full">
                    <p class="text-stone-600 text-sm mb-6 leading-relaxed">將應用程式安裝到桌面，<br>享受離線秒開的流暢體驗！</p>
                    <button onclick="installPwaFromModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition shadow-sm mb-2">安裝到桌面</button>
                    <button onclick="closePwaModal()" class="w-full bg-stone-50 hover:bg-stone-100 text-stone-500 font-bold py-2.5 rounded-xl transition">暫時不用</button>
                </div>

                <!-- iOS 特例引導模式 -->
                <div id="pwa-ios-view" class="hidden w-full">
                    <p class="text-stone-600 text-sm mb-6 leading-relaxed">
                        請點擊下方 <span class="inline-flex items-center justify-center bg-stone-100 px-1.5 py-0.5 rounded border border-stone-200 mx-0.5"><svg class="w-4 h-4 text-stone-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span> 分享圖示<br>並選擇<strong>「加入主畫面」</strong><br>即可享受離線秒開的流暢體驗！
                    </p>
                    <button onclick="closePwaModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition shadow-sm">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 書卷選擇 Modal (Book Selection Modal) -->
    <div id="book-modal" class="fixed inset-0 bg-stone-900/60 hidden flex items-center justify-center z-50 transition-opacity backdrop-blur-sm" onclick="if(event.target === this) toggleBookModal()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl mx-4 flex flex-col max-h-[85vh] relative transform transition-transform scale-100">
            <div class="p-5 border-b border-stone-200 flex justify-between items-center shrink-0 bg-stone-50 rounded-t-2xl">
                <h4 class="font-bold text-stone-800 text-xl flex items-center gap-2">
                    <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    選擇書卷
                </h4>
                <div class="flex items-center gap-3 md:gap-4">
                    <!-- 顯示中英縮寫 Switch -->
                    <label class="flex items-center cursor-pointer gap-2 select-none" title="切換顯示中英縮寫">
                        <span class="text-xs font-bold text-stone-500 hidden sm:inline">顯示中英縮寫</span>
                        <span class="text-xs font-bold text-stone-500 sm:hidden">縮寫</span>
                        <div class="relative inline-flex items-center">
                            <input type="checkbox" id="toggle-abbrev-view" class="sr-only peer">
                            <div class="w-9 h-5 bg-stone-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                        </div>
                    </label>
                    <div class="w-px h-5 bg-stone-300"></div>
                    <button onclick="toggleBookModal()" class="text-stone-500 hover:text-stone-800 transition bg-stone-200 hover:bg-stone-300 rounded-full p-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            <div id="book-modal-body" class="p-5 md:p-6 overflow-y-auto bg-white rounded-b-2xl">
                <!-- JS 動態產生膠囊按鈕內容 -->
            </div>
        </div>
    </div>

    <!-- 章節選擇 Modal (Chapter & Verse Modal) -->
    <div id="cv-modal" class="fixed inset-0 bg-stone-900/60 hidden flex items-center justify-center z-50 transition-opacity backdrop-blur-sm" onclick="if(event.target === this) closeCvModal()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[500px] mx-4 flex flex-col h-[70vh] relative transform transition-transform scale-100 overflow-hidden">
            <div class="p-4 border-b border-stone-200 flex justify-between items-center shrink-0 bg-stone-50">
                <h4 id="cv-modal-title" class="font-bold text-stone-800 text-lg flex items-center gap-2">
                    選擇起始章節
                </h4>
                <button onclick="closeCvModal()" class="text-stone-500 hover:text-stone-800 transition bg-stone-200 hover:bg-stone-300 rounded-full p-1.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <!-- 左側：章 (Chapter) -->
                <div class="w-1/2 overflow-y-auto p-4 border-r border-stone-200 relative bg-white">
                    <h5 id="cv-modal-chapter-subtitle" class="text-sm font-bold text-stone-400 mb-3 text-center sticky top-0 bg-white/95 backdrop-blur py-2 z-10 uppercase tracking-widest">第 幾 章</h5>
                    <div id="cv-modal-chapters" class="grid grid-cols-5 gap-2">
                        <!-- JS 動態生成章 -->

        // ==========================================

        // ==========================================
        async function checkAndUpdateDataInBackground() {
            try {
                const localRcuvTime = await localforage.getItem('RCUV_rcuv_timestamp');
                const localEsvTime = await localforage.getItem('RCUV_esv_timestamp');

                const [headRcuv, headEsv] = await Promise.all([
                    fetch('../rcuv.json?t=' + Date.now(), { method: 'HEAD' }),
                    fetch('../esv2016.json?t=' + Date.now(), { method: 'HEAD' })
                ]);

                if (headRcuv.ok) {
                    const serverRcuvTime = headRcuv.headers.get('Last-Modified');
                    if (serverRcuvTime && serverRcuvTime !== localRcuvTime) {
                        const res = await fetch('../rcuv.json?t=' + Date.now());
                        if (res.ok) {
                            const newData = await res.json();
                            await localforage.setItem('RCUV_data', newData);
                            await localforage.setItem('RCUV_rcuv_timestamp', serverRcuvTime);
                        }
                    }
                }

                if (headEsv.ok) {
                    const serverEsvTime = headEsv.headers.get('Last-Modified');
                    if (serverEsvTime && serverEsvTime !== localEsvTime) {
                        const res = await fetch('../esv2016.json?t=' + Date.now());
                        if (res.ok) {
                            const newEsv = await res.json();
                            await localforage.setItem('RCUV_esv_data', newEsv);
                            await localforage.setItem('RCUV_esv_timestamp', serverEsvTime);
                        }
                    }
                }
            } catch (e) {
                console.warn('背景檢查更新機制失敗:', e);
            }
        }

        // ==========================================
        // 4. 網址解析器 (Parser) 與多卡片狀態綁定
        // ==========================================
        function parseSingleRef(refStr) {
            let card = { id: generateCardId(), b: "創世記", fc: 1, fv: 1, tc: 1, tv: 999 };
            const match = refStr.trim().match(/^(\d?[A-Za-z]+)(.*?)$/);
            if (!match) return null;
            
            const bAbbrev = match[1];
            const coords = match[2];
            if (!bookMap[bAbbrev]) return null;
            card.b = bookMap[bAbbrev];
            
            if (!coords) {
                card.fc = 1; card.fv = 1;
                const chapters = Object.keys(bibleData[card.b]).map(Number).sort((a,b)=>a-b);
                card.tc = chapters[chapters.length - 1];
                card.tv = 999;
            } else {
                const parts = coords.split('-');
                const startParts = parts[0].split(':');
                card.fc = parseInt(startParts[0]) || 1;
                card.fv = startParts.length > 1 ? parseInt(startParts[1]) : 1;
                
                if (parts.length > 1) {
                    const endParts = parts[1].split(':');
                    if (endParts.length === 2) {
                        card.tc = parseInt(endParts[0]);
                        card.tv = parseInt(endParts[1]);
                    } else {
                        if (startParts.length === 2) {
                            card.tc = card.fc;
                            card.tv = parseInt(endParts[0]);
                        } else {
                            card.tc = parseInt(endParts[0]);
                            card.tv = 999;
                        }
                    }
                } else {
                    card.tc = card.fc;
                    card.tv = startParts.length > 1 ? card.fv : 999;
                }
            }
            return card;
        }

        function validateCardState(card) {
            if (!bibleData[card.b]) card.b = "創世記";
            const chapters = Object.keys(bibleData[card.b]).map(Number).sort((a,b)=>a-b);
            if (!chapters.includes(card.fc)) card.fc = chapters[0];
            
            let fVerses = Object.keys(bibleData[card.b][card.fc]).map(Number).sort((a,b)=>a-b);
            if (!fVerses.includes(card.fv)) card.fv = fVerses[0];

            if (!chapters.includes(card.tc) || card.tc < card.fc) card.tc = card.fc;
            
            let tVerses = Object.keys(bibleData[card.b][card.tc]).map(Number).sort((a,b)=>a-b);
            if (card.tc === card.fc) tVerses = tVerses.filter(v => v >= card.fv);
            
            if (card.tv === 999 || !tVerses.includes(card.tv)) {
                card.tv = tVerses[tVerses.length - 1];
            }
        }

        function parseUrlAndRender(refParamOverride = null) {
            const params = new URLSearchParams(window.location.search);
            const refParam = params.get('ref') || refParamOverride;
            
            cardStates = [];
            if (refParam) {
                // 以半形分號 (;) 切割多筆參考範圍
                const refParts = refParam.split(';').filter(Boolean);
                refParts.forEach(ref => {
                    const card = parseSingleRef(ref);
                    if (card) {
                        validateCardState(card);
                        cardStates.push(card);
                    }
                });
            }

            if (!cardStates.length) {
                let defaultCard = { id: generateCardId(), b: "創世記", fc: 1, fv: 1, tc: 1, tv: 999 };
                validateCardState(defaultCard);
                cardStates.push(defaultCard);
            }

            renderAllCards();
            updateUrlAndTitle();
        }

        window.addEventListener('popstate', () => {
            if (isDataReady) parseUrlAndRender();
        });

        function getCardRefStr(card) {
            const abbrev = revBookMap[card.b];
            const fc = card.fc, fv = card.fv, tc = card.tc, tv = card.tv;
            const chapters = Object.keys(bibleData[card.b]).map(Number).sort((a,b)=>a-b);
            const maxChap = chapters[chapters.length - 1];
            const maxTVerse = Object.keys(bibleData[card.b][tc]).map(Number).sort((a,b)=>a-b).pop();
            
            const isWholeBook = (fc === 1 && fv === 1 && tc === maxChap && tv === maxTVerse);
            const isWholeChapter = (fv === 1 && tc === fc && tv === maxTVerse);
            const isMultiWholeChapters = (fv === 1 && tv === maxTVerse);

            if (isWholeBook) return abbrev;
            if (tc === fc) {
                if (isWholeChapter) return `${abbrev}${fc}`;
                if (fv === tv) return `${abbrev}${fc}:${fv}`;
                return `${abbrev}${fc}:${fv}-${tv}`;
            } else {
                if (isMultiWholeChapters) return `${abbrev}${fc}-${tc}`;
                return `${abbrev}${fc}:${fv}-${tc}:${tv}`;
            }
        }

        function getCardTitleStr(card) {
            const b = card.b, fc = card.fc, fv = card.fv, tc = card.tc, tv = card.tv;
            const unitName = (b === '詩篇') ? '篇' : '章';
            const chapters = Object.keys(bibleData[b]).map(Number).sort((a,b)=>a-b);
            const maxChap = chapters[chapters.length - 1];
            const maxTVerse = Object.keys(bibleData[b][tc]).map(Number).sort((a,b)=>a-b).pop();
            
            const isWholeBook = (fc === 1 && fv === 1 && tc === maxChap && tv === maxTVerse);
            const isWholeChapter = (fv === 1 && tc === fc && tv === maxTVerse);
            const isMultiWholeChapters = (fv === 1 && tv === maxTVerse);

            if (isWholeBook) return `${b} 全卷`;
            if (tc === fc) {
                if (isWholeChapter) return `${b} 第 ${fc} ${unitName}`;
                if (fv === tv) return `${b} ${fc}:${fv}`;
                return `${b} ${fc}:${fv}-${tv}`;
            } else {
                if (isMultiWholeChapters) return `${b} 第 ${fc} - ${tc} ${unitName}`;
                return `${b} ${fc}:${fv}-${tc}:${tv}`;
            }
        }

        function updateUrlAndTitle() {
            if (!isDataReady || !cardStates.length) return;
            
            const refStrings = cardStates.map(card => getCardRefStr(card));
            const fullRefStr = refStrings.join(';');
            const firstCardTitle = getCardTitleStr(cardStates[0]);
            const titleStr = cardStates.length > 1 ? `${firstCardTitle} 等${cardStates.length}段` : firstCardTitle;
            
            const newUrl = `${window.location.pathname}?ref=${fullRefStr}`;
            if (window.location.search !== `?ref=${fullRefStr}`) {
                window.history.pushState(null, '', newUrl);
            }
            document.title = `${titleStr} | 和合本 2010`;
            localforage.setItem('RCUV_last_read_ref', fullRefStr).catch(e => console.warn('寫入進度失敗:', e));
        }

        // ==========================================
        // 5. 經文多卡片渲染與控制 Engine
        // ==========================================
        function renderAllCards() {
            if (!els.cardsContainer) return;
            let html = '';

            cardStates.forEach((card) => {
                const book = card.b;
                const fc = card.fc, fv = card.fv, tc = card.tc, tv = card.tv;
                const unitName = (book === '詩篇') ? '篇' : '章';
                
                const isFirstBook = bookOrderArray.indexOf(book) === 0;
                const isPrevDisabled = (isFirstBook && fc === 1);
                const isLastBook = bookOrderArray.indexOf(book) === bookOrderArray.length - 1;
                const allChapters = Object.keys(bibleData[book] || {}).map(Number).sort((a,b)=>a-b);
                const maxChap = allChapters[allChapters.length - 1];
                const isNextDisabled = (isLastBook && tc === maxChap);

                let scriptureHtml = '';
                if (!bibleData[book]) {
                    scriptureHtml = '<p class="text-stone-400">無法讀取書卷資料。</p>';
                } else {
                    let chunks = [];
                    allChapters.forEach(c => {
                        if (c >= fc && c <= tc) {
                            chunks.push(`<h5 class="text-2xl font-bold text-stone-800 ${c === fc ? 'mb-4' : 'mt-10 mb-4'} border-b border-stone-200 pb-2">${book} 第 ${c} ${unitName}</h5>`);
                            const verses = Object.keys(bibleData[book][c]).map(Number).sort((a,b)=>a-b);
                            verses.forEach(v => {
                                if (c === fc && c === tc) {
                                    if (v < fv || v > tv) return;
                                } else if (c === fc) {
                                    if (v < fv) return;
                                } else if (c === tc) {
                                    if (v > tv) return;
                                }
                                let rawText = bibleData[book][c][v];
                                let formattedText = rawText.replace(/\?註：(.*?)\?/g, (match, p1) => {
                                    const safeFootnote = p1.replace(/['"&<>]/g, char => ({'\'':'&#39;','"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
                                    return `<span class="inline-flex items-center justify-center cursor-pointer text-xl ml-1 opacity-80 hover:opacity-100 hover:scale-110 transition-transform" onclick="showFootnoteModal('註：${safeFootnote}')" title="點擊查看註釋">📝</span>`;
                                });
                                let esvTextHtml = '';
                                if (esvData && esvData[book] && esvData[book][c] && esvData[book][c][v]) {
                                    esvTextHtml = `<span class="esv-text text-stone-500 text-[15px] mt-1 leading-snug font-sans">${esvData[book][c][v]}</span>`;
                                }
                                chunks.push(`
                                    <div class="mb-3 flex items-start leading-relaxed">
                                        <strong class="text-stone-400 font-bold mr-3 text-base w-6 text-right shrink-0 select-none pt-[2px]">${v}</strong>
                                        <div class="flex flex-col">
                                            <span class="text-stone-800 text-lg">${formattedText}</span>
                                            ${esvTextHtml}
                                        </div>
                                    </div>
                                `);
                            });
                        }
                    });
                    scriptureHtml = chunks.length ? chunks.join('') : '<p class="text-stone-400">無法抽取指定的經文範圍。</p>';
                }

                html += `
                <article class="scripture-card min-h-[calc(100vh-4rem)] bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden mb-6 flex flex-col" id="${card.id}">
                    <!-- 卡片上方選單控制器，於同一高度最右方放置極簡 ✖ 按鈕 -->
                    <div class="p-3 sm:p-4 bg-stone-50 border-b border-stone-200 flex justify-between items-center gap-2 shrink-0">
                        <div class="flex flex-wrap items-center gap-1.5 md:gap-2">
                            <button onclick="goToCardPrevChapter('${card.id}')" class="p-1.5 md:p-2 border border-stone-300 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition disabled:opacity-30 disabled:cursor-not-allowed bg-white shadow-sm outline-none focus:ring-2 focus:ring-amber-500 shrink-0" ${isPrevDisabled ? 'disabled' : ''} title="上一章">
                                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                            </button>

                            <button onclick="openBookModalForCard('${card.id}')" class="py-1.5 px-3 md:px-4 border border-stone-300 rounded-full focus:ring-2 focus:ring-amber-500 outline-none bg-white text-stone-800 font-bold text-sm sm:text-base flex items-center gap-1.5 shadow-sm transition hover:bg-stone-50 shrink-0" title="點擊更換書卷">
                                <span>${card.b}</span>
                            </button>
                            
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="openCvModalForCard('${card.id}', 'from')" class="py-1.5 px-3 border border-stone-300 rounded-lg bg-white text-stone-800 hover:bg-stone-100 transition flex items-center gap-1 shadow-sm focus:ring-2 focus:ring-amber-500 outline-none" title="點擊修改起始節">
                                    <span class="text-sm font-bold tracking-wide">${card.fc} : ${card.fv}</span>
                                </button>
                                <span class="text-stone-300 font-bold">-</span>
                                <button onclick="openCvModalForCard('${card.id}', 'to')" class="py-1.5 px-3 border border-stone-300 rounded-lg bg-white text-stone-800 hover:bg-stone-100 transition flex items-center gap-1 shadow-sm focus:ring-2 focus:ring-amber-500 outline-none" title="點擊修改結束節">
                                    <span class="text-sm font-bold tracking-wide">${card.tc} : ${card.tv}</span>
                                </button>
                            </div>

                            <button onclick="goToCardNextChapter('${card.id}')" class="p-1.5 md:p-2 border border-stone-300 rounded-full text-stone-500 hover:bg-stone-100 hover:text-stone-800 transition disabled:opacity-30 disabled:cursor-not-allowed bg-white shadow-sm outline-none focus:ring-2 focus:ring-amber-500 shrink-0" ${isNextDisabled ? 'disabled' : ''} title="下一章">
                                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>

                        <!-- 極簡 ✖ 關閉按鈕 (2張及以上卡片才顯示) -->
                        ${cardStates.length > 1 ? `
                        <button onclick="removeCard('${card.id}')" class="p-1.5 md:p-2 text-stone-400 hover:text-red-600 transition rounded-full hover:bg-stone-100 shrink-0" title="移除卡片">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>` : ''}
                    </div>
                    
                    <!-- 經文內容主體 -->
                    <div class="p-6 md:p-8 text-stone-800 leading-loose font-serif text-lg flex-1">
                        ${scriptureHtml}
                    </div>
                </article>
                `;
            });

            els.cardsContainer.innerHTML = html;
            els.cardsContainer.classList.toggle('bilingual-mode', isBilingual);
        }

        // 導航：指定卡片前進一章
        window.goToCardNextChapter = function(cardId) {
            if (!isDataReady) return;
            const card = cardStates.find(c => c.id === cardId);
            if (!card) return;
            
            const chapters = Object.keys(bibleData[card.b]).map(Number).sort((a,b)=>a-b);
            const maxChap = chapters[chapters.length - 1];
            let navigated = false;
            
            if (card.tc < maxChap) {
                navigateToFullChapter(card, card.b, card.tc + 1);
                navigated = true;
            } else {
                const bookIndex = bookOrderArray.indexOf(card.b);
                if (bookIndex < bookOrderArray.length - 1) {
                    const nextBook = bookOrderArray[bookIndex + 1];
                    navigateToFullChapter(card, nextBook, 1);
                    navigated = true;
                }
            }
            if (navigated) handleNavEngagement();
        };

        // 導航：指定卡片後退一章
        window.goToCardPrevChapter = function(cardId) {
            if (!isDataReady) return;
            const card = cardStates.find(c => c.id === cardId);
            if (!card) return;
            
            let navigated = false;
            if (card.fc > 1) {
                navigateToFullChapter(card, card.b, card.fc - 1);
                navigated = true;
            } else {
                const bookIndex = bookOrderArray.indexOf(card.b);
                if (bookIndex > 0) {
                    const prevBook = bookOrderArray[bookIndex - 1];
                    const chapters = Object.keys(bibleData[prevBook]).map(Number).sort((a,b)=>a-b);
                    const lastChap = chapters[chapters.length - 1];
                    navigateToFullChapter(card, prevBook, lastChap);
                    navigated = true;
                }
            }
            if (navigated) handleNavEngagement();
        };

        function navigateToFullChapter(card, bookName, chapter) {
            card.b = bookName;
            card.fc = chapter;
            card.fv = 1;
            card.tc = chapter;
            const verses = Object.keys(bibleData[bookName][chapter]).map(Number).sort((a,b)=>a-b);
            card.tv = verses[verses.length - 1];
            stopTTS();
            renderAllCards();
            updateUrlAndTitle();
        }

        // 新增卡片：一律歸零載入系統預設值（《創世記》第1章全章）
        window.addNewCard = function() {
            if (!isDataReady) return;
            const newCard = { id: generateCardId(), b: "創世記", fc: 1, fv: 1, tc: 1, tv: 999 };
            validateCardState(newCard);
            cardStates.push(newCard);
            stopTTS();
            renderAllCards();
            updateUrlAndTitle();

            // 延遲以保障 DOM 更新後平滑捲動至新卡片
            setTimeout(() => {
                const el = document.getElementById(newCard.id);
                if (el) {
                    const headerOffset = els.mainHeader ? els.mainHeader.offsetHeight : 60;
                    const top = el.getBoundingClientRect().top + window.scrollY - (headerOffset + 16);
                    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                }
            }, 50);
        };

        // 移除卡片
        window.removeCard = function(cardId) {
            if (cardStates.length <= 1) return;
            cardStates = cardStates.filter(c => c.id !== cardId);
            stopTTS();
            renderAllCards();
            updateUrlAndTitle();
        };

        // 參與度計數與 PWA 推廣
        async function handleNavEngagement() {
            try {
                let count = await localforage.getItem('RCUV_navClickCount') || 0;
                if (count < 10) {
                    count++;
                    await localforage.setItem('RCUV_navClickCount', count);
                    if (count === 10) {
                        await localforage.setItem('RCUV_navClickCount', 11);
                        setTimeout(() => {
                            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                            if (isStandalone) return;
                            if (isIOS) {
                                showPwaModal('ios');
                            } else if (deferredPrompt) {
                                showPwaModal('standard');
                            }
                        }, 500);
                    }
                }
            } catch (e) {
                console.error("Engagement tracking error:", e);
            }
        }

        // ==========================================
        // 5.5 Modal 觸發與多實例控制 binding
        // ==========================================
        window.openBookModalForCard = function(cardId) {
            activeModalCardId = cardId;
            toggleBookModal();
        };

        window.selectBook = function(bookName) {
            if (!bibleData[bookName] || !activeModalCardId) return;
            const card = cardStates.find(c => c.id === activeModalCardId);
            if (!card) return;
            
            card.b = bookName;
            const chapters = Object.keys(bibleData[bookName]).map(Number).sort((a,b)=>a-b);
            card.fc = chapters[0];
            card.fv = 1;
            card.tc = chapters[0];
            const verses = Object.keys(bibleData[bookName][chapters[0]]).map(Number).sort((a,b)=>a-b);
            card.tv = verses[verses.length - 1];
            
            toggleBookModal();
            stopTTS();
            renderAllCards();
            updateUrlAndTitle();
        };

        window.openCvModalForCard = function(cardId, type) {
            activeModalCardId = cardId;
            const card = cardStates.find(c => c.id === cardId);
            if (!card || !bibleData[card.b]) return;
            
            const unitName = (card.b === '詩篇') ? '篇' : '章';
            cvState.type = type;
            document.getElementById('cv-modal-title').textContent = type === 'from' ? `選擇起始${unitName}節` : `選擇結束${unitName}節`;
            document.getElementById('cv-modal-chapter-subtitle').textContent = `第 幾 ${unitName}`;
            
            cvState.chap = type === 'from' ? card.fc : card.tc;
            cvState.verse = type === 'from' ? card.fv : card.tv;
            
            renderCvChapters();
            renderCvVerses(cvState.chap);
            document.getElementById('cv-modal').classList.remove('hidden');
        };

        window.closeCvModal = function() {
            document.getElementById('cv-modal').classList.add('hidden');
        };

        function renderCvChapters() {
            const card = cardStates.find(c => c.id === activeModalCardId);
            if (!card) return;
            const chapters = Object.keys(bibleData[card.b]).map(Number).sort((a,b)=>a-b);
            const container = document.getElementById('cv-modal-chapters');
            
            let minChap = 1;
            let maxChap = chapters[chapters.length - 1];
            if (cvState.type === 'to') minChap = card.fc;
            
            let html = '';
            const paddingCount = (minChap - 1) % 5;
            for(let i = 0; i < paddingCount; i++) html += `<div class="invisible py-2"></div>`;
            for(let c = minChap; c <= maxChap; c++) {
                const isActive = c === cvState.chap;
                const btnClass = isActive ? 'bg-amber-500 text-white shadow-md transform scale-105' : 'bg-white text-stone-700 hover:bg-amber-100 border border-stone-200';
                html += `<button onclick="handleCvChapClick(${c})" class="py-2 text-center rounded-lg font-bold text-[15px] transition ${btnClass}">${c}</button>`;
            }
            container.innerHTML = html;
        }

        function renderCvVerses(chap) {
            const card = cardStates.find(c => c.id === activeModalCardId);
            if (!card || !bibleData[card.b] || !bibleData[card.b][chap]) return;
            
            const verses = Object.keys(bibleData[card.b][chap]).map(Number).sort((a,b)=>a-b);
            const container = document.getElementById('cv-modal-verses');
            let minVerse = verses[0] || 1;
            let maxVerse = verses[verses.length - 1];
            if (cvState.type === 'to' && chap === card.fc) minVerse = card.fv;
            
            let html = '';
            const paddingCount = (minVerse - 1) % 5;
            for(let i = 0; i < paddingCount; i++) html += `<div class="invisible py-2"></div>`;
            for(let v = minVerse; v <= maxVerse; v++) {
                if (!verses.includes(v)) {
                    html += `<div class="invisible py-2"></div>`;
                    continue;
                }
                const isActive = v === cvState.verse;
                const btnClass = isActive ? 'bg-amber-500 text-white shadow-md transform scale-105' : 'bg-white text-stone-700 hover:bg-amber-100 border border-stone-200';
                html += `<button onclick="handleCvVerseClick(${v})" class="py-2 text-center rounded-lg font-bold text-[15px] transition ${btnClass}">${v}</button>`;
            }
            container.innerHTML = html;
        }

        window.handleCvChapClick = function(c) {
            cvState.chap = c;
            const card = cardStates.find(cd => cd.id === activeModalCardId);
            let newMinVerse = 1;
            if (cvState.type === 'to' && c === card.fc) newMinVerse = card.fv;
            
            const verses = Object.keys(bibleData[card.b][c]).map(Number).sort((a,b)=>a-b);
            const firstValidVerse = verses.find(v => v >= newMinVerse) || verses[0];
            cvState.verse = firstValidVerse;
            renderCvChapters();
            renderCvVerses(c);
        };

        window.handleCvVerseClick = function(v) {
            cvState.verse = v;
            const card = cardStates.find(cd => cd.id === activeModalCardId);
            if (!card) return;
            
            if (cvState.type === 'from') {
                card.fc = cvState.chap;
                card.fv = cvState.verse;
                if (card.tc < card.fc) card.tc = card.fc;
                if (v === 1) {
                    card.tc = card.fc;
                    const verses = Object.keys(bibleData[card.b][card.fc]).map(Number).sort((a,b)=>a-b);
                    card.tv = verses[verses.length - 1];
                }
            } else {
                card.tc = cvState.chap;
                card.tv = cvState.verse;
            }
            validateCardState(card);
            closeCvModal();
            stopTTS();
            renderAllCards();
            updateUrlAndTitle();
        };

        // 雙語對照切換
        els.btnBilingual.addEventListener('click', () => {
            isBilingual = !isBilingual;
            if (els.cardsContainer) els.cardsContainer.classList.toggle('bilingual-mode', isBilingual);
            if (isBilingual) {
                els.btnBilingual.classList.remove('text-stone-500');
                els.btnBilingual.classList.add('bg-stone-800', 'text-white', 'hover:bg-stone-700', 'hover:text-white');
            } else {
                els.btnBilingual.classList.add('text-stone-500');
                els.btnBilingual.classList.remove('bg-stone-800', 'text-white', 'hover:bg-stone-700', 'hover:text-white');
            }
            localforage.setItem('RCUV_bilingual', isBilingual);
        });

        if (els.toggleAbbrev) {
            els.toggleAbbrev.addEventListener('change', function() {
                document.getElementById('book-modal-body').classList.toggle('abbrev-mode', this.checked);
                localforage.setItem('RCUV_abbrev_view', this.checked);
            });
        }

        // ==========================================
        // 6. 語音朗讀模組 (TTS Engine)
        // ==========================================
        function populateVoiceList() {
            const allVoices = synth.getVoices();
            let baseVoices = allVoices.filter(v => 
                (v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Chinese')) && 
                (v.lang.includes('TW') || v.name.toLowerCase().includes('taiwan'))
            );
            if (baseVoices.length === 0) baseVoices = allVoices.filter(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Chinese'));
            
            const priorityKeywords = ['HsiaoChen', 'HsiaoYu', 'Online', 'Natural', 'Premium'];
            const premiumVoices = baseVoices.filter(v => priorityKeywords.some(keyword => v.name.includes(keyword)));
            voices = premiumVoices.length > 0 ? premiumVoices : baseVoices;
            
            els.voiceSelect.innerHTML = voices.length ? '' : '<option value="">(系統無可用中文語音)</option>';
            if (!voices.length) return;

            localforage.getItem('RCUV_tts_voice_name').then(savedVoiceName => {
                voices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    option.textContent = voice.name.replace('Microsoft ', '').replace('Google ', '');
                    option.value = i;
                    if (savedVoiceName === voice.name || (!savedVoiceName && (voice.name.includes('HsiaoChen') || voice.name.includes('國語')))) {
                        option.selected = true;
                    }
                    els.voiceSelect.appendChild(option);
                });
            });

            localforage.getItem('RCUV_tts_rate').then(rate => {
                if (rate) els.rateSelect.value = rate;
            });
        }

        els.voiceSelect.addEventListener('change', e => {
            if (e.target.value !== "" && voices[e.target.value]) localforage.setItem('RCUV_tts_voice_name', voices[e.target.value].name);
        });
        els.rateSelect.addEventListener('change', e => {
            localforage.setItem('RCUV_tts_rate', e.target.value);
        });

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.error("Wake Lock 錯誤:", err); }
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) wakeLock.release().then(() => { wakeLock = null; });
        }

        function setTtsUI(state) {
            if (state === 'playing') {
                els.btnPlay.classList.add('hidden');
                els.btnPause.classList.remove('hidden');
                els.btnResume.classList.add('hidden');
                els.btnStop.classList.remove('hidden');
                els.btnLoop.classList.remove('hidden');
            } else if (state === 'paused') {
                els.btnPlay.classList.add('hidden');
                els.btnPause.classList.add('hidden');
                els.btnResume.classList.remove('hidden');
                els.btnStop.classList.remove('hidden');
                els.btnLoop.classList.remove('hidden');
            } else {
                els.btnPlay.classList.remove('hidden');
                els.btnPause.classList.add('hidden');
                els.btnResume.classList.add('hidden');
                els.btnStop.classList.add('hidden');
                els.btnLoop.classList.add('hidden');
            }
        }

        function startTTS() {
            if (isPlaying) stopTTS();
            
            let textToSpeak = "";
            mappings = [];
            let currIdx = 0;

            // 自 #cards-container 中一線遍歷所有卡片的標題與中文經文，不限片數依序誦讀
            els.cardsContainer.querySelectorAll('h5, span.text-stone-800').forEach(el => {
                const scrollTarget = el.tagName === 'SPAN' ? el.closest('div.mb-3') : el;
                const textPart = el.tagName === 'H5' ? el.innerText + '。\n' : el.innerText.replace(/📝/g, '') + ' ';
                
                mappings.push({
                    startIndex: currIdx,
                    endIndex: currIdx + textPart.length,
                    element: scrollTarget
                });
                
                textToSpeak += textPart;
                currIdx += textPart.length;
            });

            if (textToSpeak.trim() === "") return;

            const rawChunks = [];
            let match;
            const regex = /[^。！？；.!?;\n]+[。！？；.!?;\n]*/g;
            while ((match = regex.exec(textToSpeak)) !== null) {
                rawChunks.push({ text: match[0], startIndex: match.index });
            }
            if (rawChunks.length === 0 && textToSpeak.trim()) {
                rawChunks.push({ text: textToSpeak, startIndex: 0 });
            }

            playQueue = [];
            let currText = "";
            let currStartIdx = 0;
            const MAX = 250;

            rawChunks.forEach(p => {
                let partText = p.text;
                let trimmed = partText.trim();
                if (!trimmed) return;

                if (currText.length + trimmed.length > MAX) {
                    if (currText) playQueue.push({ text: currText, startIndex: currStartIdx });
                    currText = trimmed;
                    currStartIdx = p.startIndex + partText.indexOf(trimmed);
                } else {
                    if (!currText) currStartIdx = p.startIndex + partText.indexOf(trimmed);
                    currText += (currText ? " " : "") + trimmed;
                }
            });
            if (currText) playQueue.push({ text: currText, startIndex: currStartIdx });

            currentChunkIdx = 0;
            isPlaying = true;
            isPaused = false;
            requestWakeLock();
            setTtsUI('playing');
            
            playNextChunk();
        }

        function playNextChunk() {
            if (!isPlaying || isPaused) return;
            
            if (currentChunkIdx >= playQueue.length) {
                if (isLooping && playQueue.length > 0) {
                    currentChunkIdx = 0;
                } else {
                    stopTTS();
                    return;
                }
            }

            const chunkObj = playQueue[currentChunkIdx];
            const utterance = new SpeechSynthesisUtterance(chunkObj.text);
            window._currentUtterance = utterance;

            if (els.voiceSelect.value !== "" && voices[els.voiceSelect.value]) {
                utterance.voice = voices[els.voiceSelect.value];
            }
            utterance.lang = 'zh-TW';
            utterance.rate = parseFloat(els.rateSelect.value);

            utterance.onstart = () => {
                const targetMap = mappings.find(m => chunkObj.startIndex >= m.startIndex && chunkObj.startIndex < m.endIndex);
                if (targetMap && targetMap.element) {
                    const elRect = targetMap.element.getBoundingClientRect();
                    const headerOffset = els.mainHeader ? els.mainHeader.offsetHeight : 60;
                    const targetScrollTop = window.scrollY + elRect.top - (headerOffset + 16);
                    window.scrollTo({ top: Math.max(0, targetScrollTop), behavior: 'smooth' });
                }
            };

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;
                currentChunkIdx++;
                playNextChunk();
            };

            utterance.onerror = (e) => {
                if (e.error === 'canceled' || e.error === 'interrupted' || isPaused || !isPlaying) return;
                console.error("TTS Error:", e);
                els.statusBar.innerHTML = `⚠️ 語音發生錯誤 (${e.error})，嘗試繼續...`;
                els.statusBar.classList.remove('hidden', 'bg-amber-100');
                els.statusBar.classList.add('bg-red-100', 'text-red-700');
                currentChunkIdx++;
                playNextChunk();
            };

            synth.speak(utterance);
        }

        function pauseTTS() {
            if (!isPlaying || isPaused) return;
            isPaused = true;
            synth.cancel();
            setTtsUI('paused');
        }

        function resumeTTS() {
            if (!isPlaying || !isPaused) return;
            isPaused = false;
            setTtsUI('playing');
            playNextChunk();
        }

        function stopTTS() {
            isPlaying = false;
            isPaused = false;
            currentChunkIdx = 0;
            playQueue = [];
            window._currentUtterance = null;
            synth.cancel();
            releaseWakeLock();
            setTtsUI('stopped');
        }

        els.btnPlay.addEventListener('click', startTTS);
        els.btnPause.addEventListener('click', pauseTTS);
        els.btnResume.addEventListener('click', resumeTTS);
        els.btnStop.addEventListener('click', stopTTS);
        els.btnLoop.addEventListener('click', () => {
            isLooping = !isLooping;
            if (isLooping) {
                els.btnLoop.classList.remove('text-stone-500', 'hover:bg-stone-100', 'hover:text-stone-800');
                els.btnLoop.classList.add('bg-amber-100', 'text-amber-700', 'hover:bg-amber-200');
                els.btnLoop.title = "循環播放：開啟";
            } else {
                els.btnLoop.classList.remove('bg-amber-100', 'text-amber-700', 'hover:bg-amber-200');
                els.btnLoop.classList.add('text-stone-500', 'hover:bg-stone-100', 'hover:text-stone-800');
                els.btnLoop.title = "循環播放：關閉";
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPlaying && !isPaused) {
                requestWakeLock();
            }
        });

        // ==========================================
        // 7. PPTX 簡報匯出模組 (跨卡片全區整合)
        // ==========================================
        function exportPPTX() {
            const PptxClass = window.pptxgen || window.PptxGenJS;
            if (!PptxClass) {
                alert('簡報匯出模組尚未載入完成或處於離線狀態，請確認網路連線後重試。');
                return;
            }

            if (!cardStates.length) return;

            // 效能防呆限制：計算所有卡片的總和章節數，若超過 5 章則警告
            const totalChaps = cardStates.reduce((sum, c) => sum + (c.tc - c.fc + 1), 0);
            if (totalChaps > 5) {
                alert('為確保瀏覽器與系統效能，一次最多僅能匯出合計 5 個章的投影片。');
                return;
            }

            const originalContent = els.btnExportPpt.innerHTML;
            els.btnExportPpt.disabled = true;
            els.btnExportPpt.innerHTML = `<span class="text-xs font-bold px-1 animate-pulse">⏳ 產生中...</span>`;

            try {
                let pres = new PptxClass();
                pres.layout = 'LAYOUT_16x9';

                pres.defineSlideMaster({
                    title: "BIBLE_MASTER",
                    background: { color: "1E1E1E" },
                    objects: [
                        { text: { text: "和合本 2010", options: { x: '5%', y: '92%', w: '90%', h: '5%', align: 'right', color: '888888', fontSize: 14, fontFace: "Microsoft JhengHei" } } },
                        { placeholder: { options: { name: 'title', type: 'title', x: '5%', y: '8%', w: '90%', h: '10%', color: 'FFFFFF', fontSize: 32, fontFace: "Microsoft JhengHei", align: 'left', valign: 'top', bold: false } } },
                        { placeholder: { options: { name: 'body', type: 'body', x: '5%', y: '22%', w: '90%', h: '70%', color: 'FFFFFF', fontSize: 44, fontFace: "Microsoft JhengHei", align: 'left', valign: 'top', bold: true } } }
                    ]
                });

                // 遍歷所有卡片，將內容依序產製為簡報
                cardStates.forEach((card) => {
                    const book = card.b;
                    const fc = card.fc, fv = card.fv, tc = card.tc, tv = card.tv;
                    if (!bibleData[book]) return;

                    const chapters = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
                    chapters.forEach(c => {
                        if (c >= fc && c <= tc) {
                            const verses = Object.keys(bibleData[book][c]).map(Number).sort((a,b)=>a-b);
                            verses.forEach(v => {
                                if (c === fc && c === tc) {
                                    if (v < fv || v > tv) return;
                                } else if (c === fc) {
                                    if (v < fv) return;
                                } else if (c === tc) {
                                    if (v > tv) return;
                                }

                                let rawText = bibleData[book][c][v];
                                let cleanText = rawText.replace(/\?註：(.*?)\?/g, '').trim();

                                let slide = pres.addSlide({ masterName: "BIBLE_MASTER" });
                                slide.addText(`${book} ${c}:${v}`, { placeholder: 'title' });
                                slide.addText(cleanText, { placeholder: 'body' });
                            });
                        }
                    });
                });

                // 動態決定檔名
                let filename = '';
                if (cardStates.length === 1) {
                    const c0 = cardStates[0];
                    if (c0.fc === c0.tc) {
                        filename = `${c0.b}${c0.fc}：${c0.fv}-${c0.tv}.pptx`;
                    } else {
                        filename = `${c0.b}${c0.fc}：${c0.fv}-${c0.tc}：${c0.tv}.pptx`;
                    }
                } else {
                    const c0 = cardStates[0];
                    filename = `${c0.b}${c0.fc}：${c0.fv}等${cardStates.length}段經文.pptx`;
                }

                pres.writeFile({ fileName: filename }).then(() => {
                    els.btnExportPpt.disabled = false;
                    els.btnExportPpt.innerHTML = originalContent;
                }).catch(err => {
                    console.error("PPTX 寫入錯誤:", err);
                    alert('檔案產生失敗，請稍後再試。');
                    els.btnExportPpt.disabled = false;
                    els.btnExportPpt.innerHTML = originalContent;
                });

            } catch (err) {
                console.error("PPTX 產生過程發生例外錯誤:", err);
                alert('匯出模組發生錯誤，請重新整理頁面。');
                els.btnExportPpt.disabled = false;
                els.btnExportPpt.innerHTML = originalContent;
            }
        }

        els.btnExportPpt.addEventListener('click', exportPPTX);

        // ==========================================
        // 8. Modals, Dropdowns 與分享工具
        // ==========================================
        els.btnSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            els.settingsDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (els.settingsContainer && !els.settingsContainer.contains(e.target)) {
                els.settingsDropdown.classList.add('hidden');
            }
        });

        function toggleFootnoteModal(content = '') {
            const modal = document.getElementById('footnote-modal');
            const txtEl = document.getElementById('footnote-content');
            if (content) txtEl.innerHTML = content;
            modal.classList.toggle('hidden');
        }
        window.showFootnoteModal = toggleFootnoteModal;

        function toggleBookModal() {
            document.getElementById('book-modal').classList.toggle('hidden');
        }
        window.toggleBookModal = toggleBookModal;

        function initBookModalContent() {
            const modalBody = document.getElementById('book-modal-body');
            let html = '';
            
            const renderBookButtons = (booksArray, colorClass) => {
                let btnHtml = '';
                booksArray.forEach(book => {
                    const enAbbrev = revBookMap[book];
                    const chFormatted = bookAbbrevFormatCh[enAbbrev];
                    const enFormatted = bookAbbrevFormatEn[enAbbrev];
                    btnHtml += `<button onclick="selectBook('${book}')" class="px-3 py-1.5 border rounded-full transition shadow-sm ${colorClass} flex flex-col items-center justify-center min-w-[68px]">
                                    <span class="normal-view text-[15px] font-bold">${book}</span>
                                    <span class="abbrev-view flex-col items-center w-full">
                                        <span class="text-[15px] leading-tight">${chFormatted}</span>
                                        <span class="text-[10px] leading-tight opacity-75 font-mono mt-[2px]">${enFormatted}</span>
                                    </span>
                                 </button>`;
                });
                return btnHtml;
            };

            modalBookCategories.forEach(cat => {
                html += `<div class="mb-8 last:mb-0">`;
                html += `
                    <div class="flex items-center gap-2 mb-4">
                        <h3 class="text-xl font-bold text-stone-800">${cat.title}</h3>
                `;
                if (cat.hasTooltip) {
                    html += `
                        <div class="relative group cursor-pointer inline-flex items-center" tabindex="0">
                            <svg class="w-5 h-5 text-stone-400 hover:text-stone-600 transition outline-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div class="absolute left-0 top-full mt-2 w-72 sm:w-80 bg-stone-800 text-stone-50 text-sm p-4 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 pointer-events-none text-left">
                                <p class="font-bold text-amber-400 mb-2">「舊約順序好陌生？」</p>
                                <p class="leading-relaxed text-stone-200 mb-2">本系統採用舊約聖經的原始架構，也是主耶穌親口證實的順序：「摩西的<strong>律法</strong>、<strong>先知</strong>的書，和《<strong>詩篇</strong>》上所記一切指著我的話都必須應驗。」（路24:44）。</p>
                                <p class="leading-relaxed text-stone-200 mb-2">此外，主耶穌提到殉道者的血是「從<strong>亞伯</strong>…直到…<strong>撒迦利亞</strong>」（路11:51），透露出主耶穌心中的舊約排序是從亞伯所在的《創世記》到撒迦利亞所在的《歷代志》。</p>
                                <p class="leading-relaxed text-stone-200">老張是主耶穌的門徒，老張跟隨主耶穌所定的聖經排序。但老張也肯定，使徒們多次引用的《七十士譯本》奠定了教會歷代採用的舊約書卷順序，即基督徒兩千年來熟悉的順序。因此兩種順序並無絕對優劣。</p>
                                <div class="absolute -top-2 left-3 w-4 h-4 bg-stone-800 transform rotate-45"></div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;

                cat.sections.forEach(sec => {
                    html += `<div class="mb-5 last:mb-0">`;
                    html += `<h4 class="text-sm font-bold text-stone-500 mb-2.5 border-b border-stone-200 pb-1">${sec.name}</h4>`;
                    
                    if (sec.subsections) {
                        sec.subsections.forEach(subsec => {
                            html += `<h5 class="text-xs font-bold text-stone-400 mt-3 mb-2">${subsec.subName}</h5>`;
                            html += `<div class="flex flex-wrap gap-2">`;
                            html += renderBookButtons(subsec.books, sec.color);
                            html += `</div>`;
                        });
                    } else {
                        html += `<div class="flex flex-wrap gap-2">`;
                        html += renderBookButtons(sec.books, sec.color);
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            });
            modalBody.innerHTML = html;
        }

        function copyUrl() {
            const url = window.location.href;
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = url;
            dummy.select();
            try {
                document.execCommand('copy');
                alert('✅ 網址已成功複製！');
            } catch (err) {
                alert('❌ 複製失敗，請手動複製網址列。');
            }
            document.body.removeChild(dummy);
        }

        document.getElementById('btn-share').addEventListener('click', async () => {
            let titleStr = document.title.split(' | ')[0];
            let blocks = [];
            cardStates.forEach(card => {
                let cardTitle = `【${getCardTitleStr(card)}】`;
                let lines = [];
                if (bibleData && bibleData[card.b]) {
                    const book = card.b;
                    const fc = card.fc, fv = card.fv, tc = card.tc, tv = card.tv;
                    const chapters = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
                    chapters.forEach(c => {
                        if (c >= fc && c <= tc) {
                            const verses = Object.keys(bibleData[book][c]).map(Number).sort((a,b)=>a-b);
                            verses.forEach(v => {
                                if (c === fc && c === tc) {
                                    if (v < fv || v > tv) return;
                                } else if (c === fc) {
                                    if (v < fv) return;
                                } else if (c === tc) {
                                    if (v > tv) return;
                                }
                                let rawText = bibleData[book][c][v];
                                let cleanText = rawText.replace(/\?註：(.*?)\?/g, '').trim();
                                lines.push(`${v} ${cleanText}`);
                            });
                        }
                    });
                }
                blocks.push(`${cardTitle}\n${lines.join('\n')}`);
            });
            let scriptureText = blocks.join('\n\n');
            
            let shareText = `${titleStr}\n\n${scriptureText}\n\n`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: document.title,
                        text: shareText,
                        url: window.location.href
                    });
                } catch (e) { console.log('分享取消或失敗'); }
            } else {
                copyUrl();
            }
        });

        // ==========================================
        // 9. PWA 安裝邏輯與推廣
        // ==========================================
        let deferredPrompt;
        const initialUrlParams = new URLSearchParams(window.location.search);
        const hasPwaIntent = initialUrlParams.get('pwa') === '1';

        window.showPwaModal = function(type) {
            document.getElementById('pwa-standard-view').classList.add('hidden');
            document.getElementById('pwa-ios-view').classList.add('hidden');
            if (type === 'standard') {
                document.getElementById('pwa-standard-view').classList.remove('hidden');
            } else if (type === 'ios') {
                document.getElementById('pwa-ios-view').classList.remove('hidden');
            }
            document.getElementById('pwa-modal').classList.remove('hidden');
        };

        window.closePwaModal = function() {
            document.getElementById('pwa-modal').classList.add('hidden');
        };

        window.installPwaFromModal = async function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                closePwaModal();
                if (els.btnInstallPwa) els.btnInstallPwa.classList.add('hidden');
                if (els.settingsDropdown) els.settingsDropdown.classList.add('hidden');
            }
        };

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (els.btnInstallPwa) els.btnInstallPwa.classList.remove('hidden');
            if (hasPwaIntent) {
                showPwaModal('standard');
            }
        });

        function checkIosPwaIntent() {
            if (hasPwaIntent) {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (isIOS && !isStandalone) {
                    setTimeout(() => { showPwaModal('ios'); }, 500);
                }
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            checkIosPwaIntent();
        });

    </script>
