    <!-- 防範 LINE/FB 內建瀏覽器強制跳出機制 -->
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf('Line') > -1 || ua.indexOf('LINE') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('FBAN') > -1) {
                if (window.location.search.indexOf('openExternalBrowser=1') === -1) {
                    var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(window.location.href + sep + 'openExternalBrowser=1');
                }
            }
        })();
    </script>
</head>

    <!-- 右下角版本號標示 (用於確認佈署狀態) -->
    <div class="fixed bottom-2 right-2 text-[10px] text-stone-400/60 pointer-events-none select-none z-50">v1.5</div>

    <script>
        // ==========================================
        // 1. 全域變數與字典定義
        // ==========================================
        let bibleData = null;
        let isDataReady = false;
        
        // 語音引擎相關變數
        const synth = window.speechSynthesis;
        let voices = [];
        let wakeLock = null;
        let playQueue = [];
        let currentChunkIdx = 0;
        let isPlaying = false;
        let isPaused = false;
        let mappings = []; // DOM 捲動對齊映射

        // 66 卷書中英對照表 (嚴格遵循 FSD 規範：無空白、無句點)
        const bookMap = {
            "Gen": "創世記", "Ex": "出埃及記", "Lev": "利未記", "Num": "民數記", "Deut": "申命記",
            "Josh": "約書亞記", "Judg": "士師記", "Ruth": "路得記", "1Sam": "撒母耳記上", "2Sam": "撒母耳記下",
            "1Kings": "列王紀上", "2Kings": "列王紀下", "1Chron": "歷代志上", "2Chron": "歷代志下",
            "Ezra": "以斯拉記", "Neh": "尼希米記", "Est": "以斯帖記", "Job": "約伯記", "Ps": "詩篇",
            "Prov": "箴言", "Eccles": "傳道書", "Song": "雅歌", "Isa": "以賽亞書", "Jer": "耶利米書",
            "Lam": "耶利米哀歌", "Ezek": "以西結書", "Dan": "但以理書", "Hos": "何西阿書", "Joel": "約珥書",
            "Amos": "阿摩司書", "Obad": "俄巴底亞書", "Jonah": "約拿書", "Mic": "彌迦書", "Nah": "那鴻書",
            "Hab": "哈巴谷書", "Zeph": "西番雅書", "Hag": "哈該書", "Zech": "撒迦利亞書", "Mal": "瑪拉基書",
            "Matt": "馬太福音", "Mark": "馬可福音", "Luke": "路加福音", "John": "約翰福音", "Acts": "使徒行傳",
            "Rom": "羅馬書", "1Cor": "哥林多前書", "2Cor": "哥林多後書", "Gal": "加拉太書", "Eph": "以弗所書",
            "Phil": "腓立比書", "Col": "歌羅西書", "1Thess": "帖撒羅尼迦前書", "2Thess": "帖撒羅尼迦後書",
            "1Tim": "提摩太前書", "2Tim": "提摩太後書", "Titus": "提多書", "Philem": "腓利門書", "Heb": "希伯來書",
            "James": "雅各書", "1Pet": "彼得前書", "2Pet": "彼得後書", "1John": "約翰一書", "2John": "約翰二書",
            "3John": "約翰三書", "Jude": "猶大書", "Rev": "啟示錄"
        };
        // 反向對照表 (用於生成 URL)
        const revBookMap = Object.keys(bookMap).reduce((acc, key) => { acc[bookMap[key]] = key; return acc; }, {});
        const bookOrderArray = Object.values(bookMap);

        // DOM 元素快取
        const els = {
            statusBar: document.getElementById('status-bar'),
            bookSelect: document.getElementById('book-select'),
            fChap: document.getElementById('from-chapter'),
            fVerse: document.getElementById('from-verse'),
            tChap: document.getElementById('to-chapter'),
            tVerse: document.getElementById('to-verse'),
            container: document.getElementById('scripture-container'),
            btnPlay: document.getElementById('btn-play'),
            btnPause: document.getElementById('btn-pause'),
            btnResume: document.getElementById('btn-resume'),
            btnStop: document.getElementById('btn-stop'),
            voiceSelect: document.getElementById('voice-select'),
            rateSelect: document.getElementById('rate-select')
        };

        // ==========================================
        // 2. 初始化與資料快取 (IndexedDB / localforage)
        // ==========================================
        async function initApp() {
            try {
                // PWA 分享按鈕支援偵測
                if (navigator.share) {
                    document.getElementById('icon-share').classList.remove('hidden');
                    document.getElementById('icon-copy').classList.add('hidden');
                }

                // 嘗試從本地快取讀取
                let data = await localforage.getItem('rcuv_data');
                
                if (!data) {
                    els.statusBar.innerHTML = "⏳ 正在首次下載聖經資料 (約 3MB)，請稍候...";
                    // 依據 FSD 規範，載入上層目錄的 rcuv.json
                    const response = await fetch('../rcuv.json');
                    if (!response.ok) throw new Error(`HTTP 錯誤: ${response.status}`);
                    data = await response.json();
                    
                    // 異步寫入快取，不阻塞主線程渲染
                    localforage.setItem('rcuv_data', data).catch(e => console.warn('寫入快取失敗:', e));
                }

                bibleData = data;
                isDataReady = true;
                
                // 初始化選單
                populateBookSelect();
                
                // 解析 URL 並渲染
                parseUrlAndRender();

                // 隱藏狀態列，解鎖選單
                els.statusBar.classList.add('hidden');
                document.querySelectorAll('select').forEach(el => el.disabled = false);
                els.btnPlay.disabled = false;

                // 語音初始化
                populateVoiceList();
                if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoiceList;

            } catch (error) {
                console.error("初始化失敗:", error);
                els.statusBar.classList.remove('bg-amber-100', 'text-amber-800');
                els.statusBar.classList.add('bg-red-100', 'text-red-700');
                els.statusBar.innerHTML = `❌ 載入失敗: ${error.message}。請確認連線或檔案位置。`;
                
                // 如果是 LINE / FB 擋住 indexedDB，提供複製按鈕
                if (/Line|FBAV|FBAN/i.test(navigator.userAgent)) {
                    els.statusBar.innerHTML += `<button onclick="copyUrl()" class="ml-2 underline font-bold">複製網址於外部瀏覽器開啟</button>`;
                }
            }
        }

        // ==========================================
        // 3. 網址解析器 (Parser) 與狀態綁定
        // ==========================================
        function parseUrlAndRender() {
            const params = new URLSearchParams(window.location.search);
            const refParam = params.get('ref');
            
            let state = { b: "創世記", fc: 1, fv: 1, tc: 1, tv: 1 }; // 預設值
            
            if (refParam) {
                // 解析 ?ref=Gen1:1-2:5, Gen1-2, Gen1, Gen 等格式
                // 精準分離書卷與章節座標
                const match = refParam.match(/^(\d?[A-Za-z]+)(.*?)$/);
                if (match) {
                    const bAbbrev = match[1];
                    const coords = match[2];
                    
                    if (bookMap[bAbbrev]) {
                        state.b = bookMap[bAbbrev];
                        
                        if (!coords) {
                            // Gen (整卷)
                            state.fc = 1; state.fv = 1;
                            const chapters = Object.keys(bibleData[state.b]).map(Number).sort((a,b)=>a-b);
                            state.tc = chapters[chapters.length - 1];
                            state.tv = 999; // 稍後驗證時會自動校正為最後一節
                        } else {
                            const parts = coords.split('-');
                            const startParts = parts[0].split(':');
                            state.fc = parseInt(startParts[0]) || 1;
                            state.fv = startParts.length > 1 ? parseInt(startParts[1]) : 1;
                            
                            if (parts.length > 1) {
                                const endParts = parts[1].split(':');
                                if (endParts.length === 2) {
                                    state.tc = parseInt(endParts[0]);
                                    state.tv = parseInt(endParts[1]);
                                } else {
                                    if (startParts.length === 2) { // Gen1:1-5
                                        state.tc = state.fc;
                                        state.tv = parseInt(endParts[0]);
                                    } else { // Gen1-2
                                        state.tc = parseInt(endParts[0]);
                                        state.tv = 999;
                                    }
                                }
                            } else {
                                // Gen1 or Gen1:1
                                state.tc = state.fc;
                                state.tv = startParts.length > 1 ? state.fv : 999;
                            }
                        }
                    }
                }
            }

            // 更新選單 UI (觸發連動)
            els.bookSelect.value = state.b;
            updateChapterSelects();
            
            // 安全填寫數值 (若超過範圍，下拉選單的防呆會處理)
            els.fChap.value = state.fc; updateVerseSelects('from');
            els.fVerse.value = state.fv;
            els.tChap.value = state.tc; updateVerseSelects('to');
            
            // 校正 tv=999 的情況 (選取該章最後一節)
            if(state.tv === 999 || !els.tVerse.querySelector(`option[value="${state.tv}"]`)) {
                 const opts = els.tVerse.options;
                 els.tVerse.value = opts[opts.length-1].value;
            } else {
                 els.tVerse.value = state.tv;
            }
            
            enforceValidationAndExtract();
        }

        // 綁定 popstate 事件，支援瀏覽器「上一頁/下一頁」的完整 SPA 體驗
        window.addEventListener('popstate', () => {
            if (isDataReady) parseUrlAndRender();
        });

        function updateUrlAndTitle() {
            if (!isDataReady) return;
            
            const b = els.bookSelect.value;
            const fc = parseInt(els.fChap.value);
            const fv = parseInt(els.fVerse.value);
            const tc = parseInt(els.tChap.value);
            const tv = parseInt(els.tVerse.value);
            
            const abbrev = revBookMap[b];
            let refStr = "";
            let titleStr = "";

            const isWholeBook = (fc === 1 && fv === 1 && tc === parseInt(els.tChap.options[els.tChap.options.length-1].value) && tv === parseInt(els.tVerse.options[els.tVerse.options.length-1].value));
            const isWholeChapter = (fv === 1 && tc === fc && tv === parseInt(els.tVerse.options[els.tVerse.options.length-1].value));
            const isMultiWholeChapters = (fv === 1 && tv === parseInt(els.tVerse.options[els.tVerse.options.length-1].value));

            if (isWholeBook) {
                refStr = abbrev;
                titleStr = `${b} 全卷`;
            } else if (tc === fc) {
                if (isWholeChapter) {
                    refStr = `${abbrev}${fc}`;
                    titleStr = `${b} 第 ${fc} 章`;
                } else {
                    refStr = `${abbrev}${fc}:${fv}-${tv}`;
                    titleStr = `${b} ${fc}:${fv}-${tv}`;
                }
            } else {
                if (isMultiWholeChapters) {
                    refStr = `${abbrev}${fc}-${tc}`;
                    titleStr = `${b} 第 ${fc} - ${tc} 章`;
                } else {
                    refStr = `${abbrev}${fc}:${fv}-${tc}:${tv}`;
                    titleStr = `${b} ${fc}:${fv}-${tc}:${tv}`;
                }
            }

            // 更新網址與標題
            const newUrl = `${window.location.pathname}?ref=${refStr}`;
            // 只有在 URL 真的不同時才 pushState，避免不必要的歷史紀錄堆疊
            if (window.location.search !== `?ref=${refStr}`) {
                window.history.pushState(null, '', newUrl);
            }
            document.title = `${titleStr} | 和合本 2010 朗讀`;
        }

        // ==========================================
        // 4. UI 聯動選單與防呆 (Validation)
        // ==========================================
        function populateBookSelect() {
            els.bookSelect.innerHTML = '';
            bookOrderArray.forEach(book => {
                if(bibleData[book]) {
                    const opt = document.createElement('option');
                    opt.value = book; opt.textContent = book;
                    els.bookSelect.appendChild(opt);
                }
            });
        }

        function updateChapterSelects() {
            const book = els.bookSelect.value;
            if (!bibleData[book]) return;
            
            // 嚴格依照數值排序 Chapters
            const chapters = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
            
            const buildOptions = (selectEl, selectedVal) => {
                selectEl.innerHTML = '';
                chapters.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.textContent = c;
                    selectEl.appendChild(opt);
                });
                if (selectEl.querySelector(`option[value="${selectedVal}"]`)) {
                    selectEl.value = selectedVal;
                }
            };

            buildOptions(els.fChap, els.fChap.value);
            buildOptions(els.tChap, els.tChap.value);
            
            updateVerseSelects('from');
            updateVerseSelects('to');
        }

        function updateVerseSelects(target) {
            const book = els.bookSelect.value;
            const chapEl = target === 'from' ? els.fChap : els.tChap;
            const verseEl = target === 'from' ? els.fVerse : els.tVerse;
            
            const chap = chapEl.value;
            if (!bibleData[book] || !bibleData[book][chap]) return;

            // 嚴格依照數值排序 Verses
            const verses = Object.keys(bibleData[book][chap]).map(Number).sort((a,b)=>a-b);
            const currentVal = verseEl.value;
            
            verseEl.innerHTML = '';
            verses.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v;
                verseEl.appendChild(opt);
            });

            // 如果舊的值不存在 (例如切換到較短的章節)，選取最後一節
            if (verseEl.querySelector(`option[value="${currentVal}"]`)) {
                verseEl.value = currentVal;
            } else {
                verseEl.value = target === 'from' ? verses[0] : verses[verses.length - 1];
            }
        }

        function enforceValidationAndExtract() {
            if (!isDataReady) return;
            
            const fc = parseInt(els.fChap.value);
            const fv = parseInt(els.fVerse.value);
            let tc = parseInt(els.tChap.value);
            let tv = parseInt(els.tVerse.value);

            // 防呆邏輯：結束不能小於起始
            if (tc < fc) {
                els.tChap.value = fc;
                updateVerseSelects('to');
                tc = fc;
                tv = parseInt(els.tVerse.value); // 更新 tv 因為 options 重建了
            }
            
            if (tc === fc && tv < fv) {
                els.tVerse.value = fv;
                tv = fv;
            }

            updateUrlAndTitle();
            extractAndRenderScripture();
        }

        // 綁定事件
        els.bookSelect.addEventListener('change', () => { updateChapterSelects(); enforceValidationAndExtract(); });
        els.fChap.addEventListener('change', () => { updateVerseSelects('from'); enforceValidationAndExtract(); });
        els.fVerse.addEventListener('change', enforceValidationAndExtract);
        els.tChap.addEventListener('change', () => { updateVerseSelects('to'); enforceValidationAndExtract(); });
        els.tVerse.addEventListener('change', enforceValidationAndExtract);

        // ==========================================
        // 5. 經文抽取與畫面渲染 Engine
        // ==========================================
        function extractAndRenderScripture() {
            stopTTS(); // 切換經文時停止語音

            const book = els.bookSelect.value;
            const fc = parseInt(els.fChap.value);
            const fv = parseInt(els.fVerse.value);
            const tc = parseInt(els.tChap.value);
            const tv = parseInt(els.tVerse.value);

            if (!bibleData[book]) return;

            let htmlChunks = [];
            const chapters = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
            
            chapters.forEach(c => {
                if (c >= fc && c <= tc) {
                    htmlChunks.push(`<h5 class="text-2xl font-bold text-stone-800 ${c === fc ? 'mb-4' : 'mt-10 mb-4'} border-b border-stone-200 pb-2">${book} 第 ${c} 章</h5>`);
                    
                    const verses = Object.keys(bibleData[book][c]).map(Number).sort((a,b)=>a-b);
                    verses.forEach(v => {
                        // 範圍過濾邏輯
                        if (c === fc && c === tc) {
                            if (v < fv || v > tv) return;
                        } else if (c === fc) {
                            if (v < fv) return;
                        } else if (c === tc) {
                            if (v > tv) return;
                        }

                        let rawText = bibleData[book][c][v];
                        
                        // 註解轉換邏輯 (HTML Escape & Inline SVG/Emoji)
                        let formattedText = rawText.replace(/\?註：(.*?)\?/g, (match, p1) => {
                            const safeFootnote = p1.replace(/['"&<>]/g, char => ({'\'':'&#39;','"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
                            return `<span class="inline-flex items-center justify-center cursor-pointer text-xl ml-1 opacity-80 hover:opacity-100 hover:scale-110 transition-transform" onclick="showFootnoteModal('註：${safeFootnote}')" title="點擊查看註釋">📝</span>`;
                        });

                        // 節號 Flexbox 排版與防選取 (select-none)
                        htmlChunks.push(`
                            <div class="mb-3 flex items-start leading-relaxed">
                                <strong class="text-stone-400 font-bold mr-3 text-base w-6 text-right shrink-0 select-none pt-[2px]">${v}</strong>
                                <span class="text-stone-800 text-lg">${formattedText}</span>
                            </div>
                        `);
                    });
                }
            });

            els.container.innerHTML = htmlChunks.length ? htmlChunks.join('') : '<p class="text-stone-400">無法抽取指定的經文範圍。</p>';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // 6. 語音朗讀模組 (TTS Engine) 與暫停/繼續控制
        // ==========================================
        
        function populateVoiceList() {
            const allVoices = synth.getVoices();
            let baseVoices = allVoices.filter(v => 
                (v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Chinese')) && 
                (v.lang.includes('TW') || v.name.toLowerCase().includes('taiwan'))
            );
            if (baseVoices.length === 0) baseVoices = allVoices.filter(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Chinese'));
            
            // 高擬真語音優先
            const priorityKeywords = ['HsiaoChen', 'HsiaoYu', 'Online', 'Natural', 'Premium'];
            const premiumVoices = baseVoices.filter(v => priorityKeywords.some(keyword => v.name.includes(keyword)));
            voices = premiumVoices.length > 0 ? premiumVoices : baseVoices;
            
            els.voiceSelect.innerHTML = voices.length ? '' : '<option value="">(系統無可用中文語音)</option>';
            if (!voices.length) return;

            // 讀取偏好與名稱淨化
            localforage.getItem('tts_voice_name').then(savedVoiceName => {
                voices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    option.textContent = voice.name.replace('Microsoft ', '').replace('Google ', '');
                    option.value = i;
                    if (savedVoiceName === voice.name || (!savedVoiceName && (voice.name.includes('HsiaoChen') || voice.name.includes('國語')))) {
                        option.selected = true;
                    }
                    els.voiceSelect.appendChild(option);
                });
            });

            localforage.getItem('tts_rate').then(rate => {
                if (rate) els.rateSelect.value = rate;
            });
        }

        // 綁定設定改變事件
        els.voiceSelect.addEventListener('change', e => {
            if (e.target.value !== "" && voices[e.target.value]) localforage.setItem('tts_voice_name', voices[e.target.value].name);
        });
        els.rateSelect.addEventListener('change', e => {
            localforage.setItem('tts_rate', e.target.value);
        });

        // 螢幕防休眠
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.error("Wake Lock 錯誤:", err); }
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) wakeLock.release().then(() => { wakeLock = null; });
        }

        // 切換 UI 狀態
        function setTtsUI(state) {
            if (state === 'playing') {
                els.btnPlay.classList.add('hidden');
                els.btnPause.classList.remove('hidden');
                els.btnResume.classList.add('hidden');
                els.btnStop.classList.remove('hidden');
            } else if (state === 'paused') {
                els.btnPlay.classList.add('hidden');
                els.btnPause.classList.add('hidden');
                els.btnResume.classList.remove('hidden');
                els.btnStop.classList.remove('hidden');
            } else {
                // stop
                els.btnPlay.classList.remove('hidden');
                els.btnPause.classList.add('hidden');
                els.btnResume.classList.add('hidden');
                els.btnStop.classList.add('hidden');
            }
        }

        function startTTS() {
            if (isPlaying) stopTTS();
            
            // 1. 從 DOM 擷取純文字與建立 Mappings
            let textToSpeak = "";
            mappings = [];
            let currIdx = 0;

            els.container.querySelectorAll('h5, span.text-stone-800').forEach(el => {
                const scrollTarget = el.tagName === 'SPAN' ? el.closest('div.mb-3') : el;
                // 剔除表情符號 (註解)
                const textPart = el.tagName === 'H5' ? el.innerText + '。\n' : el.innerText.replace(/📝/g, '') + ' ';
                
                mappings.push({
                    startIndex: currIdx,
                    endIndex: currIdx + textPart.length,
                    element: scrollTarget
                });
                
                textToSpeak += textPart;
                currIdx += textPart.length;
            });

            if (textToSpeak.trim() === "") return;

            // 2. 正則切分與 250 字元合併 (Chunking)
            const rawChunks = [];
            let match;
            const regex = /[^。！？；.!?;\n]+[。！？；.!?;\n]*/g;
            while ((match = regex.exec(textToSpeak)) !== null) {
                rawChunks.push({ text: match[0], startIndex: match.index });
            }
            if (rawChunks.length === 0 && textToSpeak.trim()) {
                rawChunks.push({ text: textToSpeak, startIndex: 0 });
            }

            playQueue = [];
            let currText = "";
            let currStartIdx = 0;
            const MAX = 250;

            rawChunks.forEach(p => {
                let partText = p.text;
                let trimmed = partText.trim();
                if (!trimmed) return;

                if (currText.length + trimmed.length > MAX) {
                    if (currText) playQueue.push({ text: currText, startIndex: currStartIdx });
                    currText = trimmed;
                    currStartIdx = p.startIndex + partText.indexOf(trimmed);
                } else {
                    if (!currText) currStartIdx = p.startIndex + partText.indexOf(trimmed);
                    currText += (currText ? " " : "") + trimmed;
                }
            });
            if (currText) playQueue.push({ text: currText, startIndex: currStartIdx });

            // 3. 狀態初始化與開始
            currentChunkIdx = 0;
            isPlaying = true;
            isPaused = false;
            requestWakeLock();
            setTtsUI('playing');
            
            playNextChunk();
        }

        function playNextChunk() {
            // 若為停止或暫停狀態，不進入下一個發音
            if (!isPlaying || isPaused) return;
            
            if (currentChunkIdx >= playQueue.length) {
                stopTTS(); // 播完了
                return;
            }

            const chunkObj = playQueue[currentChunkIdx];
            const utterance = new SpeechSynthesisUtterance(chunkObj.text);
            
            // GC 防護
            window._currentUtterance = utterance;

            if (els.voiceSelect.value !== "" && voices[els.voiceSelect.value]) {
                utterance.voice = voices[els.voiceSelect.value];
            }
            utterance.lang = 'zh-TW';
            utterance.rate = parseFloat(els.rateSelect.value);

            utterance.onstart = () => {
                // 沉浸式追蹤捲動
                const targetMap = mappings.find(m => chunkObj.startIndex >= m.startIndex && chunkObj.startIndex < m.endIndex);
                if (targetMap && targetMap.element) {
                    const elRect = targetMap.element.getBoundingClientRect();
                    // 設定 offset = 48 作為視覺緩衝
                    const targetScrollTop = window.scrollY + elRect.top - 48;
                    window.scrollTo({ top: Math.max(0, targetScrollTop), behavior: 'smooth' });
                }
            };

            utterance.onend = () => {
                if (!isPlaying || isPaused) return; // 避免被 cancel 觸發
                currentChunkIdx++;
                playNextChunk();
            };

            utterance.onerror = (e) => {
                if (e.error === 'canceled' || e.error === 'interrupted' || isPaused || !isPlaying) return;
                console.error("TTS Error:", e);
                els.statusBar.innerHTML = `⚠️ 語音發生錯誤 (${e.error})，嘗試繼續...`;
                els.statusBar.classList.remove('hidden', 'bg-amber-100');
                els.statusBar.classList.add('bg-red-100', 'text-red-700');
                currentChunkIdx++;
                playNextChunk();
            };

            synth.speak(utterance);
        }

        // 狀態儲存式暫停 (Soft Pause)
        function pauseTTS() {
            if (!isPlaying || isPaused) return;
            isPaused = true;
            synth.cancel(); // 立即中斷發音，但記憶 currentChunkIdx
            setTtsUI('paused');
        }

        // 從斷點恢復
        function resumeTTS() {
            if (!isPlaying || !isPaused) return;
            isPaused = false;
            setTtsUI('playing');
            playNextChunk(); // 從 currentChunkIdx 繼續
        }

        function stopTTS() {
            isPlaying = false;
            isPaused = false;
            currentChunkIdx = 0;
            playQueue = [];
            window._currentUtterance = null;
            synth.cancel();
            releaseWakeLock();
            setTtsUI('stopped');
        }

        // 綁定按鈕
        els.btnPlay.addEventListener('click', startTTS);
        els.btnPause.addEventListener('click', pauseTTS);
        els.btnResume.addEventListener('click', resumeTTS);
        els.btnStop.addEventListener('click', stopTTS);

        // 可見度切換時防禦休眠
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPlaying && !isPaused) {
                requestWakeLock();
            }
        });

        // ==========================================
        // 7. Modals 與分享工具
        // ==========================================
        function toggleSettingsModal() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }
        document.getElementById('btn-settings').addEventListener('click', toggleSettingsModal);

        function toggleFootnoteModal(content = '') {
            const modal = document.getElementById('footnote-modal');
            const txtEl = document.getElementById('footnote-content');
            if (content) txtEl.innerHTML = content;
            modal.classList.toggle('hidden');
        }
        window.showFootnoteModal = toggleFootnoteModal;

        function copyUrl() {
            const url = window.location.href;
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = url;
            dummy.select();
            try {
                document.execCommand('copy');
                alert('✅ 網址已成功複製！');
            } catch (err) {
                alert('❌ 複製失敗，請手動複製網址列。');
            }
            document.body.removeChild(dummy);
        }

        document.getElementById('btn-share').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: document.title,
                        text: '與您分享聖經經文',
                        url: window.location.href
                    });
                } catch (e) { console.log('分享取消或失敗'); }
            } else {
                copyUrl();
            }
        });

        // 啟動系統
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
