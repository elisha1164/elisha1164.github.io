<!-- 版本號: 1.3.0 | 修改主旨: 修復卡片卡在兩張中間之問題（改為單卡獨立顯示切換），並停用觸控滑動手勢僅保留按鈕切換 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Old Testament Book Themes Memory (舊約各卷主題背誦)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }
    .card {
      display: none;
      width: 100%;
      box-sizing: border-box;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #edf2f7;
    }
    .card.active {
      display: block;
    }
    .card.slide-next {
      animation: slideInNext 0.22s ease-out;
    }
    .card.slide-prev {
      animation: slideInPrev 0.22s ease-out;
    }
    @keyframes slideInNext {
      from { opacity: 0.3; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInPrev {
      from { opacity: 0.3; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .card-header .reference {
      margin-bottom: 0;
    }
    .card-counter {
      font-size: 0.9rem;
      color: #a0aec0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .reference {
      font-size: 1.35rem;
      font-weight: bold;
      color: #2b6cb0;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 95px;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #3182ce;
    }
    .feedback {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .success { background-color: #c6f6d5; color: #22543d; }
    .error { background-color: #fed7d7; color: #742a2a; }
    .hint { margin-top: 8px; font-size: 0.88rem; color: #4a5568; }
    .tabs {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #f4f6f8;
      padding: 12px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 10px 22px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      background: white;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      border-color: #3182ce;
      color: #3182ce;
    }
    .tab-btn.active {
      background: #3182ce;
      border-color: #3182ce;
      color: white;
      box-shadow: 0 2px 6px rgba(49, 130, 206, 0.3);
    }
    .recite-box {
      font-size: 1.15rem;
      line-height: 1.9;
      color: #2d3748;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #38a169;
      padding: 18px 20px;
      border-radius: 8px;
    }
    .recite-box strong {
      color: #1a202c;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: #38a169;
      text-underline-offset: 3px;
    }
    .hint-box {
      background: #ebf8ff;
      border-left: 4px solid #3182ce;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-family: Consolas, 'SFMono-Regular', Menlo, Monaco, monospace;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #2b6cb0;
    }
    .hint-label {
      font-weight: bold;
      color: #2c5282;
      margin-right: 6px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .diff-view {
      margin-top: 10px;
      padding: 10px 14px;
      background: #fff5f5;
      border-radius: 6px;
      border: 1px solid #feb2b2;
      line-height: 1.8;
      font-size: 0.95rem;
      color: #4a5568;
    }
    .diff-extra {
      color: #c53030;
      text-decoration: line-through;
      background: #fed7d7;
      padding: 1px 4px;
      border-radius: 3px;
      margin: 0 2px;
      font-weight: 500;
    }
    .diff-missing {
      color: #2b6cb0;
      font-weight: 700;
      background: #ebf8ff;
      padding: 1px 4px;
      border-radius: 3px;
      margin: 0 2px;
    }
    .carousel-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .nav-btn {
      width: 32px;
      height: 72px;
      border: 1px solid #cbd5e0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: bold;
      color: #4a5568;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.2s ease;
      user-select: none;
    }
    .nav-btn:hover:not(:disabled) {
      background: #3182ce;
      color: white;
      border-color: #3182ce;
    }
    .nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .card-viewport {
      overflow: hidden;
      flex: 1;
      border-radius: 12px;
      touch-action: pan-y;
    }
    .card-track {
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 id="quiz-title">Old Testament Themes (背誦模式)</h1>
  <div class="tabs">
    <button class="tab-btn active" data-mode="recite" onclick="switchMode('recite')">背誦模式</button>
    <button class="tab-btn" data-mode="hint" onclick="switchMode('hint')">首字提示模式</button>
    <button class="tab-btn" data-mode="quiz" onclick="switchMode('quiz')">測驗模式</button>
  </div>
  <div class="carousel-wrapper">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="prevCard()" title="上一張 (Alt+Left)">&lt;</button>
    <div class="card-viewport" id="card-viewport">
      <div class="card-track" id="quiz-list"></div>
    </div>
    <button class="nav-btn next-btn" id="next-btn" onclick="nextCard()" title="下一張 (Alt+Right)">&gt;</button>
  </div>
</div>

      recite: "[<strong>Wisdom</strong>,] [to impart moral <strong>discernment</strong> and <strong>discretion</strong>] [and to develop mental <strong>clarity</strong> and <strong>perception</strong>.]"

    },

    },

    },
    {
      ref: "Micah",
      text: "Judgment and Restoration of Judah, the injustice of Judah is exposed along with the righteousness and justice of the LORD.",
      recite: "[<strong>Judgment</strong> and <strong>Restoration</strong> of Judah,] [the <strong>injustice</strong> of Judah is <strong>exposed</strong>] [along with the <strong>righteousness</strong> and <strong>justice</strong> of the LORD.]"
    },
    {
      ref: "Zephaniah",
      text: "The Day of the LORD, a day of judgment and restoration.",
      recite: "[The <strong>Day</strong> of the <strong>LORD</strong>,] [a day of <strong>judgment</strong> and <strong>restoration</strong>.]"
    },
    {
      ref: "Nahum",
      text: "Judgment of Nineveh, God will judge the nations.",
      recite: "[<strong>Judgment</strong> of <strong>Nineveh</strong>,] [God will <strong>judge</strong> the <strong>nations</strong>.]"
    },
    {
      ref: "Jeremiah",
      text: "Judah's Last Hour, Judah's time for repentance was running out.",
      recite: "[Judah's <strong>Last</strong> <strong>Hour</strong>,] [Judah's time for <strong>repentance</strong> was <strong>running</strong> out.]"
    },

      recite: "[<strong>Reconstruction</strong> of the <strong>Temple</strong>,] [the remnant must reorder its <strong>priorities</strong>] [and complete the <strong>temple</strong> before they can expect God's <strong>blessing</strong>.]"
    },

      ref: "Zechariah",
      text: "Preparation for the Messiah, the LORD will keep His covenant with Israel through the Messiah.",
      recite: "[<strong>Preparation</strong> for the <strong>Messiah</strong>,] [the LORD will keep His <strong>covenant</strong> with Israel] [through the <strong>Messiah</strong>.]"
    },
    {
      ref: "Malachi",
      text: "Appeal to Backsliders, repent and turn to God with sincere hearts.",
      recite: "[<strong>Appeal</strong> to <strong>Backsliders</strong>,] [<strong>repent</strong> and turn to God with <strong>sincere</strong> <strong>hearts</strong>.]"

  function stripPunctuation(str) {
    return str.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
  }

  function getFirstLetterHint(str) {
    return str.replace(/\b([a-zA-Z])[a-zA-Z]*\b/g, '$1');
  }

  let currentMode = 'recite';
  const userInputs = {};
  const userFeedback = {};

  const modeTitles = {
    recite: 'Old Testament Themes (背誦模式)',
    hint: 'Old Testament Themes Quiz (首字提示模式)',
    quiz: 'Old Testament Themes Quiz (測驗模式)'
  };

  function saveCurrentInputs() {
    if (currentMode === 'hint' || currentMode === 'quiz') {
      verses.forEach((_, index) => {
        const el = document.getElementById(`user-input-${index}`);
        if (el) {
          userInputs[index] = el.value;
        }
        const fb = document.getElementById(`feedback-${index}`);
        if (fb && fb.style.display === 'block') {
          userFeedback[index] = {
            display: 'block',
            className: fb.className,
            innerHTML: fb.innerHTML
          };
        }
      });
    }
  }

  function switchMode(mode) {
    saveCurrentInputs();
    currentMode = mode;
    document.getElementById('quiz-title').textContent = modeTitles[mode] || 'Old Testament Themes';
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    renderQuiz();
  }

  let currentIndex = 0;

  function goToCard(index, direction) {
    if (index < 0) index = 0;
    if (index >= verses.length) index = verses.length - 1;
    currentIndex = index;

    const cards = document.querySelectorAll("#quiz-list .card");
    cards.forEach((card, i) => {
      card.classList.remove("active", "slide-next", "slide-prev");
      if (i === currentIndex) {
        card.classList.add("active");
        if (direction === "next") {
          card.classList.add("slide-next");
        } else if (direction === "prev") {
          card.classList.add("slide-prev");
        }
      }
    });

    const viewport = document.getElementById("card-viewport");
    if (viewport) viewport.scrollLeft = 0;

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    if (prevBtn) prevBtn.disabled = (currentIndex === 0);
    if (nextBtn) nextBtn.disabled = (currentIndex === verses.length - 1);
  }

  function prevCard() {
    if (currentIndex > 0) {
      goToCard(currentIndex - 1, "prev");
    }
  }

  function nextCard() {
    if (currentIndex < verses.length - 1) {
      goToCard(currentIndex + 1, "next");
    }
  }

  function renderQuiz() {
    const quizList = document.getElementById("quiz-list");
    if (currentMode === 'recite') {
      quizList.innerHTML = verses.map((verse, index) => `
        <div class="card">
          <div class="card-header">
            <div class="reference">${verse.ref}</div>
            <div class="card-counter">${index + 1} / ${verses.length}</div>
          </div>
          <div class="recite-box">${verse.recite}</div>
        </div>
      `).join('');
    } else {
      quizList.innerHTML = verses.map((verse, index) => `
        <div class="card">
          <div class="card-header">
            <div class="reference">${verse.ref}</div>
            <div class="card-counter">${index + 1} / ${verses.length}</div>
          </div>
          ${currentMode === 'hint' ? `
            <div class="hint-box">
              <span class="hint-label">首字提示：</span><span class="hint-text">${getFirstLetterHint(verse.text)}</span>
            </div>
          ` : ''}
          <textarea
            id="user-input-${index}"
            placeholder="Type the theme and summary here... (press Enter or Tab to check)"
            onkeydown="handleKeyDown(event, ${index})"
          >${userInputs[index] || ''}</textarea>
          <div id="feedback-${index}" class="feedback"></div>
        </div>
      `).join('');

      verses.forEach((_, index) => {
        if (userFeedback[index]) {
          const fb = document.getElementById(`feedback-${index}`);
          if (fb) {
            fb.style.display = userFeedback[index].display;
            fb.className = userFeedback[index].className;
            fb.innerHTML = userFeedback[index].innerHTML;
          }
        }
      });
    }

    goToCard(currentIndex);
  }

  function computeWordDiff(userInput, targetText) {
    const userTokens = userInput.trim().split(/\s+/).filter(Boolean);
    const targetTokens = targetText.trim().split(/\s+/).filter(Boolean);

    const m = userTokens.length;
    const n = targetTokens.length;

    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));

    function wordsEqual(w1, w2) {
      const norm1 = w1.toLowerCase().replace(/[^\w]/g, '');
      const norm2 = w2.toLowerCase().replace(/[^\w]/g, '');
      if (norm1 && norm2) {
        return norm1 === norm2;
      }
      return w1.toLowerCase() === w2.toLowerCase();
    }

    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        if (wordsEqual(userTokens[i - 1], targetTokens[j - 1])) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
    }

    let i = m, j = n;
    const diff = [];
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && wordsEqual(userTokens[i - 1], targetTokens[j - 1])) {
        diff.unshift({ type: 'equal', text: targetTokens[j - 1] });
        i--;
        j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        diff.unshift({ type: 'missing', text: targetTokens[j - 1] });
        j--;
      } else if (i > 0) {
        diff.unshift({ type: 'extra', text: userTokens[i - 1] });
        i--;
      }
    }

    const merged = [];
    let cur = null;
    for (const item of diff) {
      if (!cur || cur.type !== item.type) {
        if (cur) merged.push(cur);
        cur = { type: item.type, tokens: [item.text] };
      } else {
        cur.tokens.push(item.text);
      }
    }
    if (cur) merged.push(cur);

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const htmlParts = merged.map(g => {
      const escaped = g.tokens.map(escapeHtml).join(' ');
      if (g.type === 'extra') {
        return `<del class="diff-extra">${escaped}</del>`;
      } else if (g.type === 'missing') {
        return `<strong class="diff-missing"><u>${escaped}</u></strong>`;
      } else {
        return escaped;
      }
    });

    return htmlParts.join(' ');
  }

  function checkAnswer(index) {
    const el = document.getElementById(`user-input-${index}`);
    if (!el) return;
    const rawInput = el.value.trim();
    userInputs[index] = el.value;
    const targetText = verses[index].text.trim();
    const feedback = document.getElementById(`feedback-${index}`);
    if (!feedback) return;

    feedback.style.display = "block";

    // 1. Check for exact match (including punctuation/capitalization)
    const isExact = rawInput === targetText;

    // 2. Check for match ignoring punctuation and capitalization
    const isPunctuationFreeMatch = stripPunctuation(rawInput) === stripPunctuation(targetText);

    if (isExact) {
      feedback.className = "feedback success";
      feedback.innerHTML = "<strong>Perfect!</strong> Exact match with all punctuation and capitalization.";
    } else if (isPunctuationFreeMatch) {
      feedback.className = "feedback success";
      feedback.innerHTML = "<strong>Correct!</strong> Words match (punctuation skipped or varied).";
    } else {
      const diffHtml = computeWordDiff(rawInput, targetText);
      feedback.className = "feedback error";
      feedback.innerHTML = `
        <strong>Not quite word-for-word yet.</strong>
        <div class="diff-view">
          <div style="font-size: 0.85rem; color: #742a2a; margin-bottom: 6px;">
            <strong>差異比對：</strong>（<del class="diff-extra">刪除線</del> 表示多寫/有誤，<strong class="diff-missing"><u>粗體底線</u></strong> 表示少寫漏字）
          </div>
          <div>${diffHtml}</div>
        </div>
        <div class="hint"><strong>Actual Text:</strong> ${targetText}</div>
      `;
    }

    userFeedback[index] = {
      display: 'block',
      className: feedback.className,
      innerHTML: feedback.innerHTML
    };
  }

  function handleKeyDown(event, index) {
    if ((event.key === "Enter" && !event.shiftKey) || event.key === "Tab") {
      if (event.key === "Enter") {
        event.preventDefault();
      }
      checkAnswer(index);
    }
  }



  // Keyboard navigation support (Alt + ArrowLeft/ArrowRight or ArrowLeft/ArrowRight when not typing)
  document.addEventListener("keydown", function (e) {
    const isInput = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT";
    if (isInput) {
      if (e.altKey && e.key === "ArrowLeft") {
        prevCard();
        e.preventDefault();
      } else if (e.altKey && e.key === "ArrowRight") {
        nextCard();
        e.preventDefault();
      }
    } else {
      if (e.key === "ArrowLeft") {
        prevCard();
      } else if (e.key === "ArrowRight") {
        nextCard();
      }
    }
  });

  renderQuiz();
</script>
