<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純前端 EPUB 閱讀與列印工具</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%230056b3' d='M12 21.33V6.2C10.6 5.4 9 5 7.5 5 5 5 2 6 2 6v15s3-1 5.5-1c2 0 4 .67 4.5 1.33z'/><path fill='%23ffffff' stroke='%230056b3' stroke-width='1.5' stroke-linejoin='round' d='M12 21.33V6.2C13.4 5.4 15 5 16.5 5 19 5 22 6 22 6v15s-3-1-5.5-1c-2 0-4 .67-4.5 1.33z'/></svg>" type="image/svg+xml">

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; background-color: #f7f9fc; color: #333; overflow: hidden;
            height: 100vh; height: 100dvh; 
        }

        /* 歡迎與載入介面 */
        #welcome-screen {
            display: flex; justify-content: center; align-items: center; height: 100dvh; width: 100vw;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); position: absolute; top: 0; left: 0; z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .welcome-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); max-width: 400px; width: 90%; text-align: center; }
        .welcome-card h1 { margin-top: 0; color: #0056b3; font-size: 24px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .input-group input[type="file"], .input-group input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fafafa; }
        .input-group .url-row { display: flex; gap: 10px; }
        .btn-primary { padding: 12px 20px; background-color: #0056b3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; white-space: nowrap; }
        .btn-primary:hover { background-color: #004494; }
        .divider { margin: 25px 0; position: relative; text-align: center; }
        .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid #ddd; z-index: 1; }
        .divider span { background: #fff; padding: 0 15px; color: #aaa; font-size: 14px; position: relative; z-index: 2; }

        /* 閱讀器介面 */
        #reader-ui {
            display: flex; flex-direction: column; height: 100dvh; width: 100vw;
            opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease;
            position: absolute; top: 0; left: 0;
        }
        body.is-reading #welcome-screen { opacity: 0; visibility: hidden; }
        body.is-reading #reader-ui { opacity: 1; visibility: visible; }

        #toolbar { background-color: #fff; padding: 10px 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 8px; align-items: center; z-index: 10; }
        #reading-progress { flex-grow: 1; min-width: 0; text-align: center; font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; user-select: none; font-weight: bold; }
        .tool-btn { background: transparent; color: #555; border: 1px solid transparent; border-radius: 6px; padding: 8px 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .tool-btn:hover { background: #f0f0f0; border-color: #ddd; color: #000; }
        #btn-close { color: #d9534f; font-size: 18px; }
        #btn-close:hover { background: #fdf2f2; border-color: #f5c6cb; }
        #btn-tts { color: #0056b3; width: 40px; }
        #btn-tts.playing { background: #e0f0ff; border-color: #b3d7ff; color: #004494; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 86, 179, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(0, 86, 179, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 86, 179, 0); } }

        #main-container { flex: 1; position: relative; display: flex; background: #fff; overflow: hidden; }
        #viewer { flex: 1; position: relative; overflow: hidden; padding: 0 15px; box-sizing: border-box; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.03); border: none; font-size: 28px; color: #888; padding: 30px 15px; cursor: pointer; z-index: 5; transition: all 0.3s; }
        .nav-btn:hover { background: rgba(0,0,0,0.08); color: #333; }
        #prev-btn { left: 0; border-radius: 0 8px 8px 0; }
        #next-btn { right: 0; border-radius: 8px 0 0 8px; }

        #glowing-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background-color: #007bff; box-shadow: 0 -1px 8px rgba(0, 123, 255, 0.8), 0 0 4px rgba(0, 123, 255, 0.5); width: 0%; z-index: 50; transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); pointer-events: none; }

        /* 目錄側邊欄 */
        #toc-tab { position: fixed; left: 0; top: 50%; transform: translateY(-50%); background: rgba(0, 86, 179, 0.6); color: white; padding: 15px 8px; border-radius: 0 8px 8px 0; cursor: pointer; z-index: 20; font-size: 18px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); transition: all 0.3s; opacity: 0; visibility: hidden; }
        body.is-reading #toc-tab { opacity: 1; visibility: visible; }
        #toc-sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100dvh; background: #fff; box-shadow: 2px 0 15px rgba(0,0,0,0.15); z-index: 30; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        #toc-sidebar.open { left: 0; }
        .toc-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .toc-content { flex: 1; overflow-y: auto; padding: 10px 0; }
        .toc-content ul { list-style: none; padding: 0; margin: 0; }
        .toc-content li a { display: block; padding: 12px 20px; color: #444; text-decoration: none; border-bottom: 1px solid #f9f9f9; transition: background 0.2s; font-size: 15px; }
        .toc-content li a:hover { background: #f0f7ff; color: #0056b3; }
        #toc-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 25; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        #toc-overlay.open { opacity: 1; visibility: visible; }

        /* 列印樣式 */
        #print-area { display: none; }
        @media print {
            html, body { height: auto !important; display: block !important; overflow: visible !important; background: #fff !important; }
            #welcome-screen, #reader-ui, #toc-tab, #toc-sidebar, #toc-overlay, #glowing-progress-bar { display: none !important; }
            #print-area { display: block !important; position: relative; width: 100%; font-size: 12pt; line-height: 1.6; color: #000; }
            .print-chapter { break-before: page; padding-top: 20px; overflow: hidden; }
        }

        #loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0056b3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .version-tag { position: fixed; bottom: 5px; right: 5px; font-size: 11px; color: #aaa; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>📖 EPUB 閱讀器</h1>
            <div class="input-group"><label for="file-input">📂 上傳本機檔案</label><input type="file" id="file-input" accept=".epub"></div>
            <div class="divider"><span>或</span></div>
            <div class="input-group">
                <label for="url-input">🌐 透過網址載入</label>
                <div class="url-row"><input type="text" id="url-input" placeholder="輸入 EPUB 網址"><button id="load-url-btn" class="btn-primary">載入</button></div>
            </div>
        </div>
    </div>

    <div id="reader-ui">
        <div id="toolbar">
            <button id="btn-close" class="tool-btn" title="返回首頁">✕</button>
            <div id="reading-progress">章節標題載入中...</div>
            <button id="btn-tts" class="tool-btn" title="朗讀本章 (自動翻頁)">▶</button>
            <button id="btn-font-dec" class="tool-btn">A-</button>
            <button id="btn-font-inc" class="tool-btn">A+</button>
            <button id="btn-line-dec" class="tool-btn">≡-</button>
            <button id="btn-line-inc" class="tool-btn">≡+</button>
            <button id="print-btn" class="tool-btn">🖨️</button>
        </div>

        <div id="main-container">
            <div id="viewer"></div>
            <button id="prev-btn" class="nav-btn">‹</button>
            <button id="next-btn" class="nav-btn">›</button>
        </div>
        <div id="toc-tab">☰</div>
        <div id="toc-overlay"></div>
        <div id="toc-sidebar">
            <div class="toc-header">章節目錄 <button id="close-toc-btn" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button></div>
            <div class="toc-content" id="toc-content"></div>
        </div>
        <div id="glowing-progress-bar"></div>
    </div>

    <div id="loading-overlay"><div class="spinner"></div><div id="loading-text">處理中...</div></div>
    <div id="print-area"></div>
    <div class="version-tag">v3.0</div>

    <script>
        // v3.0 (核心重構：語音驅動與段落換氣)
        let book = null, rendition = null, currentFontSize = 100, currentLineHeight = 1.6;
        let isPlayingTTS = false, wakeLock = null, speechQueue = [], currentSpeechIndex = 0;
        let locationsGenerated = false, tocMap = {};
        const DEFAULT_TITLE = "純前端 EPUB 閱讀與列印工具";

        const viewer = document.getElementById('viewer'), btnTts = document.getElementById('btn-tts'), progressDisplay = document.getElementById('reading-progress'), glowingBar = document.getElementById('glowing-progress-bar');

        // ==========================================
        // 核心邏輯：語音驅動與段落換氣
        // ==========================================

        async function getBestVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v => v.lang.includes('zh-TW') && v.name.includes('Natural')) || 
                   voices.find(v => v.lang.includes('zh-TW') && (v.name.includes('Premium') || v.name.includes('Siri'))) ||
                   voices.find(v => v.lang.includes('zh-TW') && v.localService) ||
                   voices.find(v => v.lang.includes('zh-TW')) ||
                   voices.find(v => v.lang.includes('zh'));
        }

        // 解析當前章節的 DOM，建立精確的語音隊列
        async function buildSpeechQueueFromCurrentChapter() {
            const loc = rendition.currentLocation();
            if (!loc) return;

            const spineItem = book.spine.get(loc.start.cfi);
            const doc = await spineItem.load(book.load.bind(book));
            const body = doc.body;
            
            let newQueue = [];
            const walk = (node) => {
                if (node.nodeType === 3) { // 文字節點
                    let text = node.textContent.trim();
                    if (text.length > 0) {
                        // 智慧斷句
                        const sentences = text.match(/[^。！？.!?\n]+[。！？.!?\n]*/g) || [text];
                        sentences.forEach(s => {
                            let cleanS = s.trim();
                            if (cleanS) {
                                // 換行/段落處理：若結尾沒標點，補上隱形句號以產生停頓
                                if (!/[。！？.!?]$/.test(cleanS)) cleanS += '。';
                                
                                const cfi = spineItem.cfiFromElement(node.parentElement);
                                newQueue.push({ text: cleanS, cfi: cfi, isNewParagraph: node.parentElement.tagName === 'P' || node.parentElement.tagName === 'DIV' });
                            }
                        });
                    }
                } else if (node.hasChildNodes()) {
                    node.childNodes.forEach(walk);
                }
            };
            walk(body);

            // 定位起點：找到目前可見範圍最接近的語音索引
            const currentCfi = loc.start.cfi;
            let startIndex = newQueue.findIndex(item => {
                return epub.Cfi.compare(item.cfi, currentCfi) >= 0;
            });
            
            speechQueue = newQueue;
            currentSpeechIndex = startIndex < 0 ? 0 : startIndex;
        }

        async function playNextSpeechItem() {
            if (!isPlayingTTS || currentSpeechIndex >= speechQueue.length) {
                if (currentSpeechIndex >= speechQueue.length && isPlayingTTS) {
                    // 本章讀完，翻到下一章開頭
                    rendition.next().then(() => setTimeout(startTTS, 600));
                }
                return;
            }

            const item = speechQueue[currentSpeechIndex];
            
            // 視覺同步核心：檢查 CFI 是否在當前畫面
            const loc = rendition.currentLocation();
            if (epub.Cfi.compare(item.cfi, loc.end.cfi) > 0 || epub.Cfi.compare(item.cfi, loc.start.cfi) < 0) {
                await rendition.display(item.cfi);
                await new Promise(r => setTimeout(r, 300)); // 等待平滑渲染
            }

            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.voice = await getBestVoice();
            
            // 經典垃圾回收防護
            window.__currentUtterance = utterance;

            utterance.onend = () => {
                currentSpeechIndex++;
                // 段落換氣處理：如果是段落切換，延遲 500ms 再讀下一句
                const delay = (speechQueue[currentSpeechIndex] && speechQueue[currentSpeechIndex].isNewParagraph) ? 500 : 50;
                setTimeout(playNextSpeechItem, delay);
            };

            utterance.onerror = () => { currentSpeechIndex++; playNextSpeechItem(); };

            window.speechSynthesis.speak(utterance);
        }

        async function startTTS() {
            isPlayingTTS = true;
            btnTts.textContent = '⏹';
            btnTts.classList.add('playing');
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            
            await buildSpeechQueueFromCurrentChapter();
            playNextSpeechItem();
        }

        function stopTTS() {
            isPlayingTTS = false;
            window.speechSynthesis.cancel();
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
            btnTts.textContent = '▶';
            btnTts.classList.remove('playing');
            speechQueue = [];
        }

        // ==========================================
        // 基礎功能與 UI 邏輯
        // ==========================================

        function updateProgressDisplay(location) {
            if (!location) return;
            let chapterTitle = "未知章節";
            let currentHref = location.start.href || (book.spine.get(location.start.cfi) ? book.spine.get(location.start.cfi).href : "");
            if (currentHref) {
                let cleanHref = decodeURIComponent(currentHref.split('#')[0]);
                chapterTitle = tocMap[cleanHref] || chapterTitle;
            }
            if (locationsGenerated && book.locations) {
                let p = Math.round(book.locations.percentageFromCfi(location.start.cfi) * 100);
                if (p >= 100 && !location.atEnd) p = 99;
                else if (location.atEnd) p = 100;
                glowingBar.style.width = p + "%";
            }
            progressDisplay.textContent = chapterTitle;
        }

        function initBook(bookData) {
            showLoading(true, '正在開啟電子書...');
            if (book) book.destroy(); 
            stopTTS();
            book = ePub(bookData);
            book.ready.then(() => {
                rendition = book.renderTo("viewer", { width: "100%", height: "100%", spread: "none" });
                
                // 背景精細計算進度 (下調至 600)
                book.locations.generate(600).then(() => { locationsGenerated = true; updateProgressDisplay(rendition.currentLocation()); });

                // 跳轉監聽：如果是手動翻頁且正在朗讀，必須重置隊列
                rendition.on('relocated', (location) => {
                    updateProgressDisplay(location);
                    if (isPlayingTTS) {
                        // 只有當不是程式發動的自動翻頁時才重置
                        window.speechSynthesis.cancel();
                        setTimeout(buildSpeechQueueFromCurrentChapter, 350).then(playNextSpeechItem);
                    }
                });

                return rendition.display();
            }).then(() => {
                showLoading(false);
                document.body.classList.add('is-reading');
                applyStyles();
                return book.loaded.navigation;
            }).then((nav) => {
                const generateToc = (items, container) => {
                    const ul = document.createElement('ul');
                    items.forEach(item => {
                        let path = decodeURIComponent(item.href.split('#')[0]);
                        tocMap[path] = item.label.trim();
                        const li = document.createElement('li'); const a = document.createElement('a');
                        a.href = "#"; a.textContent = item.label;
                        a.onclick = (e) => { e.preventDefault(); rendition.display(item.href); closeToc(); };
                        li.appendChild(a);
                        if (item.subitems && item.subitems.length > 0) generateToc(item.subitems, li);
                        ul.appendChild(li);
                    });
                    container.appendChild(ul);
                };
                document.getElementById('toc-content').innerHTML = '';
                if (nav && nav.toc) generateToc(nav.toc, document.getElementById('toc-content'));
                book.loaded.metadata.then(meta => { document.title = meta.creator ? `${meta.title} by ${meta.creator}` : meta.title; });
            });
        }

        // UI 事件
        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = (ev) => initBook(ev.target.result); reader.readAsArrayBuffer(file); }
        };
        document.getElementById('load-url-btn').onclick = async () => {
            const url = document.getElementById('url-input').value;
            if (url) { showLoading(true, '下載中...'); const res = await fetch(url); initBook(await res.arrayBuffer()); }
        };
        document.getElementById('btn-close').onclick = () => { if(confirm("關閉目前的書本？")) { stopTTS(); document.body.classList.remove('is-reading'); document.title = DEFAULT_TITLE; } };
        document.getElementById('prev-btn').onclick = () => rendition.prev();
        document.getElementById('next-btn').onclick = () => rendition.next();
        btnTts.onclick = () => isPlayingTTS ? stopTTS() : startTTS();

        document.getElementById('toc-tab').onclick = () => { document.getElementById('toc-sidebar').classList.add('open'); document.getElementById('toc-overlay').classList.add('open'); };
        const closeToc = () => { document.getElementById('toc-sidebar').classList.remove('open'); document.getElementById('toc-overlay').classList.remove('open'); };
        document.getElementById('close-toc-btn').onclick = closeToc;
        document.getElementById('toc-overlay').onclick = closeToc;

        function applyStyles() {
            if (!rendition) return;
            rendition.themes.fontSize(`${currentFontSize}%`);
            rendition.themes.register("custom", { "body": { "line-height": `${currentLineHeight} !important` }, "p": { "line-height": `${currentLineHeight} !important` } });
            rendition.themes.select("custom");
        }
        document.getElementById('btn-font-inc').onclick = () => { currentFontSize += 10; applyStyles(); };
        document.getElementById('btn-font-dec').onclick = () => { currentFontSize -= 10; applyStyles(); };
        document.getElementById('btn-line-inc').onclick = () => { currentLineHeight += 0.2; applyStyles(); };
        document.getElementById('btn-line-dec').onclick = () => { currentLineHeight -= 0.2; applyStyles(); };

        function showLoading(show, text) { document.getElementById('loading-text').textContent = text; document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }

        // ==========================================
        // 進階列印邏輯 (封裝自先前穩定版本)
        // ==========================================
        document.getElementById('print-btn').onclick = async () => {
            if (!book) return;
            stopTTS(); showLoading(true, '準備列印檔案中...');
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';
            printArea.style.fontSize = `${(currentFontSize/100)*12}pt`;
            printArea.style.lineHeight = currentLineHeight;

            const spineItems = book.spine.spineItems;
            for (let item of spineItems) {
                await item.load(book.load.bind(book));
                let body = item.document.body;
                
                // 圖片 Blob 轉換 (防破圖)
                const imgs = body.querySelectorAll('img, image');
                for (let img of imgs) {
                    let src = img.getAttribute('src') || img.getAttribute('href');
                    if (src && !src.startsWith('http') && !src.startsWith('data:')) {
                        try {
                            const absolutePath = item.href.split('/').slice(0,-1).join('/') + '/' + src;
                            const blob = await book.archive.getBlob(absolutePath.replace(/\.\.\//g, ''));
                            if (blob) {
                                const url = URL.createObjectURL(blob);
                                if(img.tagName === 'image') img.setAttribute('href', url); else img.src = url;
                            }
                        } catch(e) {}
                    }
                }

                let div = document.createElement('div');
                div.className = 'print-chapter';
                div.innerHTML = body.innerHTML;
                printArea.appendChild(div);
                item.unload();
            }
            showLoading(false);
            setTimeout(() => window.print(), 1000);
        };

        window.speechSynthesis.onvoiceschanged = () => {}; 
    </script>
</body>
</html>
