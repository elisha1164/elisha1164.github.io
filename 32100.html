  function stripPunctuation(str) {
    return str.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
  }

  function getFirstLetterHint(str) {
    return str.replace(/\b([a-zA-Z])[a-zA-Z]*\b/g, '$1');
  }

  };

        }

        if (fb && fb.style.display === 'block') {
          userFeedback[index] = {

            className: fb.className,
            innerHTML: fb.innerHTML
          };
        }
      });
    }
  }

  function switchMode(mode) {
    saveCurrentInputs();
    currentMode = mode;
    document.getElementById('quiz-title').textContent = modeTitles[mode] || 'ESV Memory';
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    renderQuiz();
  }

  let currentIndex = 0;

  function goToCard(index, direction) {
    if (index < 0) index = 0;
    if (index >= verses.length) index = verses.length - 1;
    currentIndex = index;

    const cards = document.querySelectorAll("#quiz-list .card");
    cards.forEach((card, i) => {
      card.classList.remove("active", "slide-next", "slide-prev");
      if (i === currentIndex) {
        card.classList.add("active");
        if (direction === "next") {
          card.classList.add("slide-next");
        } else if (direction === "prev") {
          card.classList.add("slide-prev");
        }
      }
    });

    const viewport = document.getElementById("card-viewport");
    if (viewport) viewport.scrollLeft = 0;

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    if (prevBtn) prevBtn.disabled = (currentIndex === 0);
    if (nextBtn) nextBtn.disabled = (currentIndex === verses.length - 1);
  }

  function prevCard() {
    if (currentIndex > 0) {
      goToCard(currentIndex - 1, "prev");
    }
  }

  function nextCard() {
    if (currentIndex < verses.length - 1) {
      goToCard(currentIndex + 1, "next");
    }
  }

  function renderQuiz() {
    const quizList = document.getElementById("quiz-list");
    if (currentMode === 'recite') {
      quizList.innerHTML = verses.map((verse, index) => `
        <div class="card">
          <div class="card-header">
            <div class="reference">${verse.ref}</div>
            <div class="card-counter">${index + 1} / ${verses.length}</div>
          </div>
          <div class="recite-box">${verse.recite}</div>
        </div>
      `).join('');
    } else {
      quizList.innerHTML = verses.map((verse, index) => `
        <div class="card">
          <div class="card-header">
            <div class="reference">${verse.ref}</div>
            <div class="card-counter">${index + 1} / ${verses.length}</div>
          </div>
          ${currentMode === 'hint' ? `
            <div class="hint-box">
              <span class="hint-label">首字提示：</span><span class="hint-text">${getFirstLetterHint(verse.text)}</span>
            </div>
          ` : ''}
          <textarea
            id="user-input-${index}"
            placeholder="Type the verse here... (press Enter or Tab to check)"
            onkeydown="handleKeyDown(event, ${index})"
          >${userInputs[index] || ''}</textarea>
          <div id="feedback-${index}" class="feedback"></div>
        </div>
      `).join('');

      verses.forEach((_, index) => {
        if (userFeedback[index]) {
          const fb = document.getElementById(`feedback-${index}`);
          if (fb) {
            fb.style.display = userFeedback[index].display;
            fb.className = userFeedback[index].className;
            fb.innerHTML = userFeedback[index].innerHTML;
          }
        }
      });
    }

    goToCard(currentIndex);
  }

  function computeWordDiff(userInput, targetText) {
    const userTokens = userInput.trim().split(/\s+/).filter(Boolean);
    const targetTokens = targetText.trim().split(/\s+/).filter(Boolean);

    const m = userTokens.length;
    const n = targetTokens.length;

    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));

    function wordsEqual(w1, w2) {
      const norm1 = w1.toLowerCase().replace(/[^\w]/g, '');
      const norm2 = w2.toLowerCase().replace(/[^\w]/g, '');
      if (norm1 && norm2) {
        return norm1 === norm2;
      }
      return w1.toLowerCase() === w2.toLowerCase();
    }

    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        if (wordsEqual(userTokens[i - 1], targetTokens[j - 1])) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
    }

    let i = m, j = n;
    const diff = [];
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && wordsEqual(userTokens[i - 1], targetTokens[j - 1])) {
        diff.unshift({ type: 'equal', text: targetTokens[j - 1] });
        i--;
        j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        diff.unshift({ type: 'missing', text: targetTokens[j - 1] });
        j--;
      } else if (i > 0) {
        diff.unshift({ type: 'extra', text: userTokens[i - 1] });
        i--;
      }
    }

    const merged = [];
    let cur = null;
    for (const item of diff) {
      if (!cur || cur.type !== item.type) {
        if (cur) merged.push(cur);
        cur = { type: item.type, tokens: [item.text] };
      } else {
        cur.tokens.push(item.text);
      }
    }
    if (cur) merged.push(cur);

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const htmlParts = merged.map(g => {
      const escaped = g.tokens.map(escapeHtml).join(' ');
      if (g.type === 'extra') {
        return `<del class="diff-extra">${escaped}</del>`;
      } else if (g.type === 'missing') {
        return `<strong class="diff-missing"><u>${escaped}</u></strong>`;
      } else {
        return escaped;
      }
    });

    return htmlParts.join(' ');
  }

  function checkAnswer(index) {
    const el = document.getElementById(`user-input-${index}`);
    if (!el) return;
    const rawInput = el.value.trim();
    userInputs[index] = el.value;
    const targetText = verses[index].text.trim();
    const feedback = document.getElementById(`feedback-${index}`);
    if (!feedback) return;

    feedback.style.display = "block";

    // 1. Check for exact match (including punctuation/capitalization)
    const isExact = rawInput === targetText;

    // 2. Check for match ignoring punctuation and capitalization
    const isPunctuationFreeMatch = stripPunctuation(rawInput) === stripPunctuation(targetText);

    if (isExact) {
      feedback.className = "feedback success";
      feedback.innerHTML = "<strong>Perfect!</strong> Exact match with all punctuation and capitalization.";
    } else if (isPunctuationFreeMatch) {
      feedback.className = "feedback success";
      feedback.innerHTML = "<strong>Correct!</strong> Words match (punctuation skipped or varied).";
    } else {
      const diffHtml = computeWordDiff(rawInput, targetText);
      feedback.className = "feedback error";
      feedback.innerHTML = `
        <strong>Not quite word-for-word yet.</strong>
        <div class="diff-view">
          <div style="font-size: 0.85rem; color: #742a2a; margin-bottom: 6px;">
            <strong>差異比對：</strong>（<del class="diff-extra">刪除線</del> 表示多寫/有誤，<strong class="diff-missing"><u>粗體底線</u></strong> 表示少寫漏字）
          </div>
          <div>${diffHtml}</div>
        </div>
        <div class="hint"><strong>Actual Text:</strong> ${targetText}</div>
      `;
    }

    userFeedback[index] = {
      display: 'block',
      className: feedback.className,
      innerHTML: feedback.innerHTML
    };
  }

  function handleKeyDown(event, index) {
    if ((event.key === "Enter" && !event.shiftKey) || event.key === "Tab") {
      if (event.key === "Enter") {
        event.preventDefault();
      }
      checkAnswer(index);
    }
  }



  // Keyboard navigation support (Alt + ArrowLeft/ArrowRight or ArrowLeft/ArrowRight when not typing)
  document.addEventListener("keydown", function (e) {
    const isInput = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT";
    if (isInput) {
      if (e.altKey && e.key === "ArrowLeft") {
        prevCard();
        e.preventDefault();
      } else if (e.altKey && e.key === "ArrowRight") {
        nextCard();
        e.preventDefault();
      }
    } else {
      if (e.key === "ArrowLeft") {
        prevCard();
      } else if (e.key === "ArrowRight") {
        nextCard();
      }
    }
  });

  renderQuiz();
</script>

</body>
</html>
