<!-- Version: 1.1.0 | Subject: 新增分行 Chunk 朗讀、螢幕防休眠、速度調節 Bar、暫停/繼續控制與 Alex/Ava 語音優化 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>紙上聽聲 | Minimal TTS Reader</title>
  
  <!-- 基本 Meta 資訊 -->
  <meta name="description" content="極簡、優雅且溫暖的紙質風格 PWA 語音朗讀工具，自動過濾 Markdown 語法，跨平台智慧挑選極致自然語音。">
  <meta name="keywords" content="TTS, 文字轉語音, 語音朗讀, PWA, Markdown, 聽書, 簡約閱讀">
  <meta name="author" content="紙上聽聲">

  <!-- Open Graph / Facebook 標籤 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="./">
  <meta property="og:title" content="紙上聽聲 | Minimal TTS Reader">
  <meta property="og:description" content="極簡、優雅且溫暖的紙質風格 PWA 語音朗讀工具，自動過濾 Markdown 語法，跨平台智慧挑選極致自然語音。">
  <meta property="og:image" content="icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="紙上聽聲">

  <!-- Twitter Card 標籤 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="紙上聽聲 | Minimal TTS Reader">
  <meta name="twitter:description" content="極簡、優雅且溫暖的紙質風格 PWA 語音朗讀工具，自動過濾 Markdown 語法，跨平台智慧挑選極致自然語音。">
  <meta name="twitter:image" content="icons/og-image.png">

  <!-- PWA 與行動裝置相容性設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F9F6F0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="紙上聽聲">

  <!-- 圖示連結 (Favicon, Apple Touch Icon, SVG) -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <!-- 樣式表 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container" role="main">
    
    <!-- 頂部品牌與標題 -->
    <header class="header">
      <img src="icons/icon.svg" alt="紙上聽聲圖示" class="brand-icon" width="52" height="52">
      <h1 class="brand-title">紙上聽聲</h1>
      <p class="brand-subtitle">Minimal PWA Text-to-Speech Reader</p>
      
      <!-- 智慧選定語音徽章 -->
      <div class="voice-badge-container" id="voiceBadge" title="系統已為您的裝置自動配對最高品質語音">
        <span class="voice-badge-text" id="voiceBadgeText">載入最佳語音中...</span>
      </div>
    </header>

    <!-- 輸入區域 -->
    <section class="input-section">
      <div class="textarea-wrapper">
        <textarea 
          id="textInput" 
          class="text-input" 
          placeholder="在此貼上或輸入文字（支援 Markdown 語法，朗讀時將自動過濾標記）..."
          aria-label="欲朗讀的文字內容"
          rows="8"
        ></textarea>
      </div>
      
      <div class="input-footer">
        <span id="charCount">0 字</span>
        <button type="button" id="btnClear" class="btn-clear" title="清空文字">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          清空
        </button>
      </div>
    </section>

    <!-- 控制列區域 -->
    <section class="controls-section">
      <!-- 主要按鈕列 (播放/暫停主按鈕 + 停止按鈕) -->
      <div class="main-buttons-group">
        <!-- 播放 / 暫停主要按鈕 -->
        <button type="button" id="btnPlay" class="btn-play-main" aria-label="開始或暫停朗讀">
          <span class="btn-play-icon" id="playIcon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </span>
          <span id="playText">開始朗讀</span>
        </button>

        <!-- 停止按鈕 -->
        <button type="button" id="btnStop" class="btn-stop-main" aria-label="停止朗讀並重置" disabled>
          <span class="btn-stop-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
          </span>
          <span>停止</span>
        </button>
      </div>

      <!-- 次要控制列 (速度調節器 + 循環播放開關) -->
      <div class="secondary-controls-group">
        <!-- 速度調節 Bar (- 1.0x +) -->
        <div class="speed-control-container" id="speedBar" title="調整朗讀語速 (0.5x ~ 2.0x)">
          <span class="speed-label">語速</span>
          <div class="speed-stepper">
            <button type="button" id="btnSpeedDown" class="btn-speed-step" aria-label="減慢語速 0.1x">-</button>
            <span id="speedValue" class="speed-display" aria-live="polite">1.0x</span>
            <button type="button" id="btnSpeedUp" class="btn-speed-step" aria-label="加快語速 0.1x">+</button>
          </div>
        </div>

        <!-- 循環播放切換開關 -->
        <label class="loop-control-container" id="loopContainer" for="loopToggle" title="點擊切換是否在讀完後自動重新循環播放">
          <span class="loop-label">
            <svg class="loop-icon" viewBox="0 0 24 24">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            循環播放
          </span>
          <span class="switch">
            <input type="checkbox" id="loopToggle" aria-label="循環播放開關">
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </section>

    <!-- 朗讀動態指示條 -->
    <div class="status-indicator is-hidden" id="statusIndicator" aria-live="polite">
      <div class="sound-waves" id="soundWaves">
        <span class="sound-wave-bar"></span>
        <span class="sound-wave-bar"></span>
        <span class="sound-wave-bar"></span>
        <span class="sound-wave-bar"></span>
      </div>
      <span id="statusText">正在朗讀...</span>
    </div>

  </main>

  <footer class="footer">
    <p>溫暖紙質 ‧ 純粹聆聽 ‧ 支援 PWA 離線安裝</p>
  </footer>

  <!-- 應用程式核心腳本 -->
  <script src="app.js"></script>
</body>
</html>
