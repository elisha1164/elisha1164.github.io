<!-- Version: 1.0.0 | Subject: 建立簡約紙質文青風格向量圖示（書頁與聲波幾何意象） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="100%" stop-color="#EFE9DD" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5C4A3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#D8CEBD" stroke-width="3" opacity="0.6" />

  <!-- Paper Card Graphic -->
  <g filter="url(#softShadow)">
    <rect x="116" y="96" width="280" height="320" rx="20" fill="#FFFFFF" stroke="#E6DCCE" stroke-width="2" />
    
    <!-- Paper lines (abstract text) -->
    <line x1="166" y1="160" x2="270" y2="160" stroke="#C4B7A6" stroke-width="6" stroke-linecap="round" />
    <line x1="166" y1="196" x2="346" y2="196" stroke="#DCD3C5" stroke-width="6" stroke-linecap="round" />
    <line x1="166" y1="232" x2="310" y2="232" stroke="#DCD3C5" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Sound Wave / Voice Ripple Motif (Warm Ochre / Earth Brown) -->
  <g transform="translate(256, 310)">
    <!-- Central Audio Beacon -->
    <circle cx="0" cy="0" r="14" fill="#8C5A3C" />
    
    <!-- Left wave arcs -->
    <path d="M -30 -22 A 38 38 0 0 0 -30 22" fill="none" stroke="#A66E4E" stroke-width="7" stroke-linecap="round" />
    <path d="M -54 -38 A 66 66 0 0 0 -54 38" fill="none" stroke="#C28B6A" stroke-width="6" stroke-linecap="round" />
    
    <!-- Right wave arcs -->
    <path d="M 30 -22 A 38 38 0 0 1 30 22" fill="none" stroke="#A66E4E" stroke-width="7" stroke-linecap="round" />
    <path d="M 54 -38 A 66 66 0 0 1 54 38" fill="none" stroke="#C28B6A" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
